<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d232a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VLXD POS">
<meta name="description" content="Phần mềm bán hàng & quản lý kho cho cửa hàng sắt thép, đinh vít, vật liệu xây dựng.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<title>VLXD POS</title>
<style>
:root{
  --bg:#eceef1;--surface:#fff;--surface2:#f1f3f5;--ink:#1d232a;--muted:#66717d;--line:#dde1e6;
  --steel:#1d232a;--steel2:#2c3641;--yel:#f5b700;--org:#ff7a00;
  --pri:#1d232a;--pri-ink:#fff;--ok:#2f9e6e;--err:#d64545;--warn:#c27c0e;
  --r:12px;--sh:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(20,30,40,.07);
  --grid:rgba(40,90,140,.07);--grid2:rgba(40,90,140,.11);--art:#2b5d8a;
  --st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom);
  --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --hz:repeating-linear-gradient(-45deg,#f5b700 0 12px,#1d232a 12px 24px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#11161b;--surface:#1a2129;--surface2:#222b35;--ink:#e7ebef;--muted:#9aa6b2;--line:#2c3742;
    --pri:#f5b700;--pri-ink:#1d232a;--sh:0 6px 20px rgba(0,0,0,.4);--grid:rgba(120,170,220,.05);--grid2:rgba(120,170,220,.08);--art:#7fb2e0}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--yel);box-shadow:0 0 0 3px rgba(245,183,0,.25)}
input:disabled,select:disabled{opacity:.6}
h1,h2,h3{font-family:var(--cond);font-weight:700;letter-spacing:.3px;text-transform:uppercase}
.hidden{display:none!important}
.grow{flex:1}.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.f{margin-bottom:12px}
.f>label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px}
.err-t{color:var(--err)}.ok-t{color:var(--ok)}
.num{font-variant-numeric:tabular-nums}
svg.i{width:20px;height:20px;flex-shrink:0}
.hazard{height:6px;background:var(--hz)}

/* ===== Nền bản vẽ công trình ===== */
.bg-art{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),linear-gradient(var(--grid2) 1px,transparent 1px),linear-gradient(90deg,var(--grid2) 1px,transparent 1px);
  background-size:20px 20px,20px 20px,100px 100px,100px 100px}
.bg-art .crane{position:absolute;right:-20px;bottom:40px;width:min(560px,55vw);color:var(--art);opacity:.12}
.bg-art .sky{position:absolute;left:0;right:0;bottom:0;width:100%;height:170px;color:var(--art);opacity:.1}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:10px;font-weight:600;background:var(--surface2);transition:transform .08s,filter .15s;white-space:nowrap}
.btn:hover{filter:brightness(.96)}.btn:active{transform:scale(.97)}
.btn.pri{background:var(--pri);color:var(--pri-ink)}
.btn.yel{background:linear-gradient(180deg,#ffc928,#f5b700);color:#1d232a;box-shadow:0 4px 12px rgba(245,183,0,.35)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:var(--err);color:#fff}
.btn.danger.ghost{background:transparent;color:var(--err);border-color:rgba(214,69,69,.35)}
.btn.sm{padding:7px 12px;font-size:13.5px;border-radius:9px}
.btn.block{width:100%}
.ibtn{width:38px;height:38px;border-radius:10px;display:inline-grid;place-items:center;background:var(--surface2)}
kbd{font:600 11px var(--sans);background:rgba(0,0,0,.12);padding:2px 6px;border-radius:5px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;padding:7px 13px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;font-weight:500}
.chip.on{background:var(--steel);color:#fff;border-color:var(--steel);box-shadow:inset 0 -3px 0 var(--yel)}
.chip button{font-size:11px;opacity:.7;margin-left:2px}
.chip-add{display:inline-flex;border:1px dashed var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.chip-add input{border:0;padding:6px 10px;font-size:14px;width:130px;background:transparent;box-shadow:none}
.chip-add button{padding:0 12px;font-weight:700;color:var(--org)}
.seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px}
.seg button{padding:8px 14px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.seg.sm button{padding:5px 10px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.tag.ok{background:rgba(47,158,110,.13);color:var(--ok)}
.tag.err{background:rgba(214,69,69,.12);color:var(--err)}
.tag.yel{background:rgba(245,183,0,.2);color:#8a6400}
.tag.blue{background:rgba(70,120,210,.13);color:#3e6fc2}
.tag.org{background:rgba(255,122,0,.14);color:#b85500}
@media (prefers-color-scheme:dark){.tag.yel{color:#f5c84a}.tag.org{color:#ffa65a}}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);padding:18px;border:1px solid var(--line)}
.card h3{margin:0 0 12px;font-size:21px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.empty svg{width:44px;height:44px;opacity:.4}

/* ===== Đăng nhập ===== */
#auth{position:fixed;inset:0;z-index:30;overflow-y:auto}
.auth{position:relative;min-height:100%;display:grid;grid-template-columns:1.15fr 1fr;grid-template-rows:1fr auto;isolation:isolate;overflow:hidden;color:#fff;
  background-color:#0c1f30;
  background-image:linear-gradient(rgba(130,190,250,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(130,190,250,.07) 1px,transparent 1px),
    linear-gradient(rgba(130,190,250,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(130,190,250,.13) 1px,transparent 1px),
    radial-gradient(ellipse at 85% 105%,rgba(255,122,0,.42),transparent 55%),radial-gradient(ellipse at 5% -5%,rgba(40,120,200,.55),transparent 60%);
  background-size:24px 24px,24px 24px,120px 120px,120px 120px,100% 100%,100% 100%}
.auth::before,.auth::after{content:"";position:absolute;left:0;right:0;height:10px;background:var(--hz);z-index:-1}
.auth::before{top:0}.auth::after{bottom:0}
.auth .crane{position:absolute;left:29%;bottom:150px;width:min(660px,50%);color:#f5b700;opacity:.55;z-index:-1}
.auth .sky{position:absolute;left:0;bottom:10px;width:100%;height:200px;color:#8cc4f5;opacity:.28;z-index:-1}
.auth .tblock{position:absolute;right:16px;bottom:24px;border:1px solid rgba(140,196,245,.45);font:600 10.5px/1.5 ui-monospace,Menlo,Consolas,monospace;color:rgba(170,210,250,.75);z-index:-1}
.auth .tblock div{padding:3px 10px;border-bottom:1px solid rgba(140,196,245,.3)}
.auth .tblock div:last-child{border:0}
.auth-art{padding:64px 56px;display:flex;flex-direction:column;justify-content:center}
.brand-lg{display:flex;align-items:center;gap:14px;margin-bottom:36px}
.brand-lg svg{width:60px;height:60px}
.brand-lg .bn{font:700 30px/1.1 var(--cond);text-transform:uppercase;letter-spacing:.5px}
.brand-lg .bt{font-size:12px;letter-spacing:3.5px;text-transform:uppercase;color:#f5b700}
.auth-art h2{font-size:54px;line-height:1.02;margin:0 0 14px;max-width:560px}
.auth-art h2 em{font-style:normal;color:#f5b700}
.auth-art p{margin:0;color:rgba(255,255,255,.8);font-size:16px;max-width:470px}
.svcs{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px;max-width:540px}
.svcs span{border:1px solid rgba(245,183,0,.5);background:rgba(10,25,40,.55);color:#ffe08a;padding:7px 13px;border-radius:6px;font-size:13.5px;font-weight:500}
.auth-side{display:flex;align-items:center;justify-content:center;padding:40px 24px calc(40px + var(--sb))}
.auth-card{width:100%;max-width:420px;background:#fff;color:#1d232a;border-radius:14px;padding:0 0 26px;box-shadow:0 30px 80px rgba(0,0,0,.5);overflow:hidden}
.auth-card>.hazard{height:10px;margin-bottom:24px}
.auth-card>*:not(.hazard){margin-left:28px;margin-right:28px}
.auth-card h1{font-size:36px;margin-top:0;margin-bottom:4px}
.auth-card .lead{color:#66717d;margin-top:0;margin-bottom:22px}
.auth-card input,.auth-card textarea{background:#fff;color:#1d232a;border-color:#d5dae0}
.auth-card textarea{font:14px ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.auth-card .f>label{color:#66717d}
.pw{position:relative}.pw input{padding-right:46px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;display:grid;place-items:center;color:var(--muted)}
.auth-msg{min-height:22px;font-size:14px;color:var(--err);margin:4px 0 10px}
.check{display:flex;align-items:center;gap:9px;font-size:14px;margin:6px 0 16px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:#1d232a}
.lock-user{display:flex;align-items:center;gap:12px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:16px}
.auth-card .lock-user{background:#f1f3f5;border-color:#dde1e6}
.auth-foot{margin-top:22px;font-size:12.5px;color:#66717d;text-align:center}
.link{color:#c27c0e;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.devcode{font:700 21px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:2px;text-align:center;padding:14px;border-radius:10px;background:rgba(245,183,0,.12);border:1.5px dashed #c99500;user-select:all;-webkit-user-select:all}
@media(max-width:899px){
  .auth{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}
  .auth-art{padding:calc(var(--st) + 34px) 22px 8px}
  .auth-art h2{font-size:36px}.brand-lg{margin-bottom:18px}.svcs{margin-top:14px}.svcs span{font-size:12.5px;padding:5px 10px}
  .auth .crane{width:90%;bottom:auto;top:60px;opacity:.22}.auth .tblock{display:none}
  .auth-side{align-items:flex-start;padding-top:18px}
  .auth-card>*:not(.hazard){margin-left:20px;margin-right:20px}
}

/* ===== Khung ứng dụng ===== */
#app{position:relative;z-index:1;display:flex;height:100dvh}
.side{position:relative;overflow:hidden;width:250px;flex-shrink:0;background:linear-gradient(180deg,#232b34,#151a20);color:#cfd6de;display:flex;flex-direction:column;padding:calc(var(--st) + 20px) 14px 16px}
.side::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;background:var(--hz)}
.side .side-art{position:absolute;left:-30px;bottom:70px;width:300px;color:#f5b700;opacity:.07;pointer-events:none}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px 20px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:14px}
.brand svg{width:44px;height:44px;flex-shrink:0}
.brand b{display:block;font:700 19px/1.1 var(--cond);text-transform:uppercase;color:#fff;letter-spacing:.3px}
.brand small{font-size:10.5px;letter-spacing:2.5px;text-transform:uppercase;color:#f5b700}
.nav{display:flex;flex-direction:column;gap:3px;position:relative}
.nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:9px;font-weight:500;color:#c6ced7;text-align:left;border-left:3px solid transparent}
.nav button:hover{background:rgba(255,255,255,.05);color:#fff}
.nav button.on{background:rgba(245,183,0,.12);color:#ffd451;border-left-color:#f5b700}
.nav .badge{margin-left:auto;background:#f5b700;color:#1d232a;font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px}
.me{position:relative;margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 8px 0;border-top:1px solid rgba(255,255,255,.08)}
.me .who{flex:1;min-width:0}
.me .who b{display:block;color:#fff;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .who small{font-size:12px;color:#f5b700}
.me .ibtn{background:rgba(255,255,255,.08);color:#cfd6de}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:#f5b700;color:#1d232a;flex-shrink:0}
.content{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:12px;padding:calc(var(--st) + 12px) 24px 12px;background:var(--surface);border-bottom:1px solid var(--line);flex-shrink:0}
.topbar h1{margin:0;font-size:26px;flex:1}
.topbar .av{width:36px;height:36px;display:none}
.trial{font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:6px;background:var(--yel);color:#1d232a;white-space:nowrap}
.trial.urgent{background:var(--err);color:#fff}
.net{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:rgba(194,124,14,.14);color:var(--warn)}
#view{flex:1;overflow-y:auto;padding:20px 24px 30px;-webkit-overflow-scrolling:touch}
#view.flush{padding:0;overflow:hidden}
.tabbar{display:none}
@media(max-width:899px){
  .side{display:none}
  .topbar{position:relative;padding:calc(var(--st) + 10px) 16px 12px;background:linear-gradient(180deg,#232b34,#1a2027);color:#fff;border:0}
  .topbar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--hz)}
  .topbar h1{font-size:22px}.topbar .av{display:grid}
  #view{padding:14px 14px 22px}
  .tabbar{display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:var(--sb);flex-shrink:0}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:10.5px;font-weight:500;color:var(--muted);position:relative}
  .tabbar button.on{color:var(--ink);font-weight:700}
  .tabbar button.on svg{color:#e0a500}
  .tabbar svg{width:23px;height:23px}
  .tabbar .badge{position:absolute;top:4px;left:calc(50% + 6px);background:#f5b700;color:#1d232a;font-size:10px;font-weight:700;border-radius:999px;padding:0 5px}
  .g2,.g3{grid-template-columns:1fr}
}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.search{position:relative;flex:1;min-width:200px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px}
.search input{padding-left:38px}
.sum-line{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13.5px;color:var(--muted);margin:0 2px 12px}
.sum-line b{color:var(--ink)}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.tabs button{padding:10px 16px;font:700 17px var(--cond);text-transform:uppercase;letter-spacing:.3px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--yel)}

/* ===== Bán hàng ===== */
.pos{display:grid;grid-template-columns:1fr 410px;height:100%}
.pos-l{display:flex;flex-direction:column;min-width:0;min-height:0}
.pos-tools{padding:14px 20px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 80%,transparent)}
.tickets{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.tickets::-webkit-scrollbar{display:none}
.tk{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:8px 13px;border-radius:9px;background:var(--surface);border:1px solid var(--line);min-width:120px;text-align:left}
.tk b{font-size:13.5px;max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk small{font-size:11.5px;color:var(--muted)}
.tk.on{background:var(--steel);color:#fff;border-color:var(--steel);box-shadow:inset 0 -4px 0 var(--yel)}
.tk.on small{color:#cfd6de}
.tk.new{justify-content:center;align-items:center;border-style:dashed;color:var(--org);font-weight:700;min-width:auto}
.plist{flex:1;overflow-y:auto;padding:14px 20px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));grid-auto-rows:max-content;gap:10px;align-content:start}
.pc{position:relative;display:flex;gap:11px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;text-align:left;transition:transform .1s,box-shadow .15s;border-left:4px solid var(--c)}
.pc:hover{box-shadow:var(--sh)}.pc:active{transform:scale(.985)}
.pc-ic{width:40px;height:40px;border-radius:8px;flex-shrink:0;display:grid;place-items:center;font-size:21px;background:var(--surface2);overflow:hidden}
.pc-ic img{width:100%;height:100%;object-fit:cover;display:block}
.pc .pc-ic{width:52px;height:52px;font-size:26px}
.pc-ic.big{width:84px;height:84px;font-size:40px;border-radius:16px}
.pe-row{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.pe-img{position:relative;width:110px;height:110px;flex-shrink:0;border-radius:16px;border:1.5px dashed var(--line);background:var(--surface2);display:grid;place-items:center;cursor:pointer;overflow:hidden;text-align:center;font-size:12px;color:var(--muted)}
.pe-img:hover{border-color:var(--yel)}
.pe-img img{width:100%;height:100%;object-fit:cover}
.pe-img .ph b{display:block;font-size:34px;line-height:1.1}
.pc-b{flex:1;min-width:0}
.pc-b b{display:block;font-size:14.5px;line-height:1.3}
.pc-b small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-f{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-top:4px}
.pc-f .pr{font-weight:700;color:var(--ink);font-size:14.5px}
.pc-f .pr small{display:inline;color:var(--muted);font-weight:500}
.st{font-size:12px;font-weight:600;color:var(--ok)}
.st.lo{color:var(--warn)}.st.z{color:var(--err)}
.pc .cnt{position:absolute;top:-6px;right:-6px;background:var(--yel);color:#1d232a;font-size:11.5px;font-weight:700;min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;padding:0 6px}
.pos-r{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.cart-h{display:flex;align-items:center;gap:10px;padding:14px 18px 8px}
.cart-h h2{margin:0;font-size:24px}
.cart-h small{color:var(--muted)}
.cust{display:flex;align-items:center;gap:10px;margin:0 18px 8px;padding:10px 12px;border-radius:10px;border:1px dashed var(--line);cursor:pointer;text-align:left;background:var(--surface2)}
.cust:hover{border-color:var(--yel)}
.cust>svg{color:#e0a500}
.cust b{display:block;font-size:14px}
.cust small{color:var(--muted);font-size:12px}

async function verifyKey(key) {

function readImage(file) {
  return new Promise((res, rej) => {
    if (!file || !/^image\//.test(file.type)) return rej(new Error('File không phải hình ảnh'));
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const z = Math.min(im.width, im.height), N = 240, c = document.createElement('canvas'); c.width = c.height = N;
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, N, N);
      g.drawImage(im, (im.width - z) / 2, (im.height - z) / 2, z, z, 0, 0, N, N); URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.82));
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Không đọc được ảnh')); };
    im.src = url;
  });
}

/* ---- VietQR ---- */
const tlv = (id, v) => id + String(v.length).padStart(2, '0') + v;
function crc16(str) { let c = 0xFFFF; for (const b of new TextEncoder().encode(str)) { c ^= b << 8; for (let i = 0; i < 8; i++) c = c & 0x8000 ? ((c << 1) ^ 0x1021) & 0xFFFF : (c << 1) & 0xFFFF; } return c.toString(16).toUpperCase().padStart(4, '0'); }
function vietQRPayload(bin, acc, amount, info) {
  const mai = tlv('00', 'A000000727') + tlv('01', tlv('00', bin) + tlv('01', acc)) + tlv('02', 'QRIBFTTA');
  const memo = norm(info || '').toUpperCase().replace(/[^A-Z0-9 ]/g, '').trim().slice(0, 25);
  const s = tlv('00', '01') + tlv('01', amount ? '12' : '11') + tlv('38', mai) + tlv('53', '704') + (amount ? tlv('54', String(Math.round(amount))) : '') + tlv('58', 'VN') + (memo ? tlv('62', tlv('08', memo)) : '') + '6304';
  return s + crc16(s);
}
const hasBank = () => !!(S.settings.bankId && S.settings.bankAcc);
function qrSvg(amount, info) { const q = qrcode(0, 'M'); q.addData(vietQRPayload(S.settings.bankId, S.settings.bankAcc, amount, info)); q.make(); return q.createSvgTag({ cellSize: 4, margin: 4, scalable: true }); }
const qrBlock = (amount, info) => `<div class="qrbox">${qrSvg(amount, info)}<div class="qa">${fmt(amount)}</div><div class="qi"><b>${esc(bankLabel(S.settings.bankId))}</b> · ${esc(S.settings.bankAcc)}<br>${esc(S.settings.bankName)}</div></div>`;

function rangeOf(r, from, to) {
  const d0 = startOfDay(Date.now()), n = new Date();
  switch (r) {
    case 'today': return [d0, d0 + DAY]; case 'yest': return [addDays(d0, -1), d0];
    case '7d': return [addDays(d0, -6), d0 + DAY]; case 'month': return [+new Date(n.getFullYear(), n.getMonth(), 1), d0 + DAY];
    case 'lmonth': return [+new Date(n.getFullYear(), n.getMonth() - 1, 1), +new Date(n.getFullYear(), n.getMonth(), 1)];
    case 'custom': return [startOfDay(new Date(from + 'T00:00:00')), startOfDay(new Date(to + 'T00:00:00')) + DAY];
    default: return [0, Infinity];
  }
}

function createImport({ supplierId, lines, paid, note }, time, by) {
  const s = supOf(supplierId), tm = time || Date.now();
  const x = { id: uid(), code: nextCode('imp', 'PN'), time: tm, supplierId: s ? s.id : null, supplierName: s ? s.name : '', note: note || '', by: by || ME.name,
    items: lines.map(l => { const p = prodOf(l.pid); return { pid: l.pid, name: p.name, unit: p.unit, qty: l.qty, cost: l.cost, amount: Math.round(l.qty * l.cost) }; }) };
  x.total = x.items.reduce((a, i) => a + i.amount, 0); x.paid = Math.min(paid, x.total);
  for (const i of x.items) { const p = prodOf(i.pid), old = Math.max(0, p.stock); p.cost = Math.round(old + i.qty > 0 ? (old * (p.cost || 0) + i.qty * i.cost) / (old + i.qty) : i.cost); move(i.pid, i.qty, 'N', x.code, tm); }
  if (s) { s.debt = (s.debt || 0) + x.total - x.paid; s.bought = (s.bought || 0) + x.total; }
  S.imports.push(x); save('imports', 'products', 'moves', 'suppliers', 'seq'); return x;
}

function computeNXT(a, b) {
  const R = S.products.map(p => {
    let after = 0, nhap = 0, xuat = 0, kiem = 0;
    for (const m of S.moves) { if (m.pid !== p.id) continue; if (m.t >= b) after += m.d; else if (m.t >= a) { if (m.type === 'N' || m.type === 'D') nhap += m.d; else if (m.type === 'B' || m.type === 'X') xuat -= m.d; else if (m.type === 'H') xuat -= m.d; else kiem += m.d; } }
    const end = p.stock - after, start = end - nhap + xuat - kiem; const r3 = v => Math.round(v * 1000) / 1000;
    return { p, start: r3(start), nhap: r3(nhap), xuat: r3(xuat), kiem: r3(kiem), end: r3(end), val: Math.max(0, end) * (p.cost || 0) };
  });

}

    .map(([name, phone, group, addr], i) => ({ id: uid() + i, name, phone, group, addr, debt: 0, spent: 0, orders: 0, note: '', created: Date.now() }));
  const now = Date.now(), t0 = startOfDay(addDays(now, -28)) + 8 * 3600000;
  const supFor = p => S.suppliers[p.cat.startsWith('Thép') ? 0 : p.cat === 'Xi măng' || p.cat.startsWith('Cát') ? 1 : 2];
  S.suppliers.forEach((s, si) => {
    const ps = S.products.filter(p => supFor(p) === s); if (!ps.length) return;
    const lines = ps.map(p => ({ pid: p.id, qty: Math.round(p.min * (3 + rnd(4))), cost: Math.round(p.priceSi * 0.9 / 10) * 10 }));

  });
  for (let i = 0; i < 52; i++) {
    const t = startOfDay(addDays(now, -rnd(21))) + (7 + rnd(10)) * 3600000 + rnd(60) * 60000; if (t > now) continue;
    const cu = rnd(3) ? S.customers[rnd(5)] : null, tk = { lines: [], customerId: cu ? cu.id : null, disc: 0, discType: '%', ship: 0 };
    const n = 1 + rnd(3);
    for (let j = 0; j < n; j++) { const p = S.products[rnd(S.products.length)]; if (tk.lines.some(l => l.pid === p.id)) continue;
      const big = p.unit === 'viên' ? 500 + rnd(3) * 500 : p.unit === 'kg' ? 20 + rnd(80) : p.unit === 'bao' ? 10 + rnd(30) : p.unit === 'm' ? 10 + rnd(40) : 1 + rnd(12);

  }

  setInterval(() => { if (LST && LST.active) licCheck(); }, 10 * 60000);
  if (!S.users.length) return renderSetup();
  const ss = sessGet(), u = ss && S.users.find(x => x.id === ss.uid && x.active);
  if (u) { const m = +S.settings.lockMin; if (m > 0 && Date.now() - (ss.last || 0) > m * 60000) { ME = u; lockScreen(); } else login(u, false); }
  else renderLogin();
})();
</script>
