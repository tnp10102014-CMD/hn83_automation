<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3a1d33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Beauty POS">
<meta name="description" content="Phần mềm thu ngân salon làm đẹp & spa: tóc, nail, mi, phun xăm, chăm sóc da, massage.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
<title>Beauty POS</title>
<style>
:root{
  --bg:#fbf3f1;--surface:rgba(255,255,255,.74);--solid:#fffaf9;--surface2:rgba(183,110,121,.09);--ink:#2d1b2a;--muted:#7a6572;--line:rgba(120,70,90,.14);
  --plum:#3a1d33;--plum2:#5a2c4d;--rose:#b76e79;--rose2:#d9a19a;--champ:#e9c9a8;
  --pri:#8c4466;--pri-ink:#fff;--ok:#2f9e6e;--err:#cf4b5b;--warn:#c9831a;
  --r:16px;--sh:0 1px 2px rgba(60,20,40,.04),0 8px 28px rgba(90,40,70,.08);
  --st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom);
  --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --serif:"Playfair Display",Georgia,"Times New Roman",serif;
  --b1:#f3b9c7;--b2:#ecc9a6;--b3:#d8bde6;--bgA:#fbf3f1;--bgB:#f6e6ee;--bgC:#f5ebe1;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#1a0f18;--surface:rgba(40,24,36,.72);--solid:#24161f;--surface2:rgba(217,161,154,.1);--ink:#f3e6ea;--muted:#b49aa7;--line:rgba(233,201,168,.14);
    --pri:#d9a19a;--pri-ink:#2a1424;--sh:0 8px 28px rgba(0,0,0,.4);
    --b1:#6a2b4c;--b2:#5a4128;--b3:#40295e;--bgA:#170d15;--bgB:#22121e;--bgC:#1d1418}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--solid);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--rose);box-shadow:0 0 0 3px rgba(183,110,121,.2)}
h1,h2,h3{font-family:var(--serif);font-weight:700;letter-spacing:.2px}
.hidden{display:none!important}
.grow{flex:1}.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.f{margin-bottom:12px}
.f>label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px}
.err-t{color:var(--err)}.ok-t{color:var(--ok)}
svg.i{width:20px;height:20px;flex-shrink:0}

/* ===== Nền nghệ thuật ===== */
.bg-art{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:linear-gradient(135deg,var(--bgA) 0%,var(--bgB) 48%,var(--bgC) 100%)}
.bg-art .blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.6;animation:drift 26s ease-in-out infinite alternate}
.bg-art .b1{width:560px;height:560px;background:var(--b1);top:-160px;left:-120px}
.bg-art .b2{width:520px;height:520px;background:var(--b2);bottom:-180px;right:-120px;animation-delay:-8s}
.bg-art .b3{width:420px;height:420px;background:var(--b3);top:38%;left:42%;animation-delay:-15s}
.bg-art .leaf{position:absolute;color:var(--rose);opacity:.16}
.bg-art .lf1{right:-30px;bottom:-20px;width:300px;transform:rotate(-18deg)}
.bg-art .lf2{left:-40px;top:30%;width:220px;transform:scaleX(-1) rotate(-10deg);opacity:.1}
.bg-art .lotus{right:6%;top:8%;width:260px;opacity:.08}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(50px,-30px) scale(1.08)}100%{transform:translate(-30px,40px) scale(.96)}}
@media (prefers-reduced-motion:reduce){.bg-art .blob,.auth .spark{animation:none}}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;font-weight:600;background:var(--surface2);transition:transform .08s,filter .15s;white-space:nowrap}
.btn:hover{filter:brightness(.97)}.btn:active{transform:scale(.97)}
.btn.pri{background:var(--pri);color:var(--pri-ink)}
.btn.rose{background:linear-gradient(135deg,#d9a19a,#b76e79 55%,#9a5068);color:#fff;box-shadow:0 6px 18px rgba(183,110,121,.38)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:var(--err);color:#fff}
.btn.danger.ghost{background:transparent;color:var(--err);border-color:rgba(207,75,91,.35)}
.btn.sm{padding:7px 12px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%}
.ibtn{width:38px;height:38px;border-radius:11px;display:inline-grid;place-items:center;background:var(--surface2)}
kbd{font:600 11px var(--sans);background:rgba(255,255,255,.25);padding:2px 6px;border-radius:5px}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;padding:7px 13px;border-radius:999px;background:var(--solid);border:1px solid var(--line);font-size:13.5px;font-weight:500}
.chip.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.chip button{font-size:11px;opacity:.7;margin-left:2px}
.chip-add{display:inline-flex;border:1px dashed var(--line);border-radius:999px;overflow:hidden;background:var(--solid)}
.chip-add input{border:0;padding:6px 10px;font-size:14px;width:120px;background:transparent;box-shadow:none}
.chip-add button{padding:0 12px;font-weight:700;color:var(--rose)}
.seg{display:inline-flex;background:var(--surface2);border-radius:12px;padding:3px}
.seg button{padding:8px 14px;border-radius:10px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--solid);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.seg.sm button{padding:5px 10px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:7px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.tag.ok{background:rgba(47,158,110,.13);color:var(--ok)}
.tag.err{background:rgba(207,75,91,.12);color:var(--err)}
.tag.rose{background:rgba(183,110,121,.16);color:#a0566a}
.tag.blue{background:rgba(70,120,210,.13);color:#3e6fc2}
.tag.warn{background:rgba(201,131,26,.14);color:#a86b10}
.tag.tier{color:var(--c);background:var(--surface2);background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.card,.list,.kpi{background:var(--surface);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.card{border-radius:var(--r);box-shadow:var(--sh);padding:18px;border:1px solid var(--line)}
.card h3{margin:0 0 12px;font-size:19px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.empty svg{width:44px;height:44px;opacity:.4}

/* ===== Đăng nhập ===== */
#auth{position:fixed;inset:0;z-index:30;overflow-y:auto}
.auth{position:relative;min-height:100%;display:grid;grid-template-columns:1.15fr 1fr;grid-template-rows:1fr auto;isolation:isolate;overflow:hidden;
  background:radial-gradient(ellipse at 15% 20%,#6d2f58 0,transparent 55%),radial-gradient(ellipse at 80% 90%,#7a4a3a 0,transparent 50%),linear-gradient(150deg,#3a1d33,#24111f 70%)}
.auth .blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.55;z-index:-1;animation:drift 22s ease-in-out infinite alternate}
.auth .a1{width:520px;height:520px;background:#c46a8a;top:-160px;left:10%}
.auth .a2{width:460px;height:460px;background:#d6a27a;bottom:-180px;left:-120px;animation-delay:-7s}
.auth .a3{width:420px;height:420px;background:#8a5bb0;top:30%;right:-140px;animation-delay:-13s}
.auth .lotus-big{position:absolute;left:4%;bottom:-40px;width:min(560px,60%);color:#e9c9a8;opacity:.2;z-index:-1}
.auth .leaf-r{position:absolute;right:-30px;top:-20px;width:260px;color:#e9c9a8;opacity:.14;transform:rotate(200deg);z-index:-1}
.auth .spark{position:absolute;width:6px;height:6px;border-radius:50%;background:#f6dcc0;box-shadow:0 0 12px 3px rgba(246,220,192,.7);opacity:.0;animation:twinkle 5s ease-in-out infinite;z-index:-1}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.6)}50%{opacity:.9;transform:scale(1)}}
.auth-art{color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:center}
.brand-lg{display:flex;align-items:center;gap:14px;margin-bottom:44px}
.brand-lg svg{width:58px;height:58px}
.brand-lg .bn{font-family:var(--serif);font-size:25px;font-weight:700}
.brand-lg .bt{font-size:12px;letter-spacing:3.5px;text-transform:uppercase;color:var(--champ)}
.auth-art h2{font-size:46px;line-height:1.12;margin:0 0 14px;max-width:500px}
.auth-art h2 em{font-style:italic;color:#f0c9b4}
.auth-art p{margin:0;color:rgba(255,255,255,.78);font-size:16px;max-width:460px}
.svcs{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px;max-width:520px}
.svcs span{border:1px solid rgba(233,201,168,.45);background:rgba(255,255,255,.06);color:#f6e2cf;padding:7px 14px;border-radius:999px;font-size:13.5px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.auth-side{display:flex;align-items:center;justify-content:center;padding:40px 24px calc(40px + var(--sb))}
.auth-card{width:100%;max-width:410px;background:rgba(255,250,249,.86);color:#2d1b2a;border:1px solid rgba(255,255,255,.6);border-radius:24px;padding:34px 30px;box-shadow:0 30px 80px rgba(20,5,15,.45);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px)}
.auth-card h1{font-size:32px;margin:0 0 6px}
.auth-card .lead{color:#7a6572;margin:0 0 24px}
.auth-card input{background:#fff;color:#2d1b2a;border-color:rgba(120,70,90,.18)}
.auth-card .f>label{color:#7a6572}
.pw{position:relative}
.pw input{padding-right:46px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;display:grid;place-items:center;color:var(--muted)}
.auth-msg{min-height:22px;font-size:14px;color:var(--err);margin:4px 0 10px}
.check{display:flex;align-items:center;gap:9px;font-size:14px;margin:6px 0 16px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:#8c4466}
.lock-user{display:flex;align-items:center;gap:12px;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:16px}
.auth-foot{margin-top:24px;font-size:12.5px;color:#7a6572;text-align:center}
.zalo-links{display:flex;gap:18px;flex-wrap:wrap}
.zalo-link{background:none;border:0;color:#0068ff;font-weight:600;font-size:13.5px;padding:8px 0 0;cursor:pointer;text-align:left}
.zalo-list{margin-top:6px;border:1px solid rgba(128,128,128,.28);border-radius:12px;background:var(--surface);max-height:190px;overflow:auto}
.zalo-list .zi{display:flex;justify-content:space-between;gap:10px;width:100%;padding:10px 12px;text-align:left;border-bottom:1px solid rgba(128,128,128,.18);font-size:14px}
.zalo-list .zi:last-child{border:0}.zalo-list .zi span{color:var(--muted);white-space:nowrap}
.zalo-list .zi b{overflow:hidden;text-overflow:ellipsis}
.btn.zalo{background:#0068ff;color:#fff;white-space:nowrap}
.zalo-box{margin:0 20px 14px;padding:10px 12px;border-radius:14px;background:var(--surface2)}
.zalo-box .small{font-size:12px;margin:6px 0 0}
.link{color:var(--rose);font-weight:600;text-decoration:underline;text-underline-offset:3px}
@media(max-width:899px){
  .auth{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}
  .auth-art{padding:calc(var(--st) + 30px) 24px 10px}
  .auth-art h2{font-size:30px}.brand-lg{margin-bottom:20px}.svcs{margin-top:16px}.svcs span{font-size:12.5px;padding:5px 11px}
  .auth-side{align-items:flex-start;padding-top:22px}
  .auth-card{padding:26px 22px}
}

/* ===== Khung ứng dụng ===== */
#app{position:relative;z-index:1;display:flex;height:100dvh}
.side{position:relative;overflow:hidden;width:250px;flex-shrink:0;background:radial-gradient(ellipse at 0 0,#6a2f58 0,transparent 60%),linear-gradient(180deg,#3a1d33,#251220);color:#e7d3dc;display:flex;flex-direction:column;padding:calc(var(--st) + 20px) 14px 16px}
.side .side-leaf{position:absolute;right:-50px;bottom:60px;width:210px;color:#e9c9a8;opacity:.12;pointer-events:none}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px 22px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:14px}
.brand svg{width:44px;height:44px;flex-shrink:0}
.brand b{display:block;font-family:var(--serif);font-size:17px;color:#fff;line-height:1.2}
.brand small{font-size:10.5px;letter-spacing:2.5px;text-transform:uppercase;color:var(--champ)}
.nav{display:flex;flex-direction:column;gap:3px;position:relative}
.nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;font-weight:500;color:#dcc6d1;text-align:left}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.on{background:linear-gradient(90deg,rgba(233,201,168,.2),rgba(233,201,168,.05));color:#fbe6d4}
.nav button.on svg{color:var(--champ)}
.nav .badge{margin-left:auto;background:var(--rose);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px}
.me{position:relative;margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 8px 0;border-top:1px solid rgba(255,255,255,.08)}
.me .who{flex:1;min-width:0}
.me .who b{display:block;color:#fff;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .who small{font-size:12px;color:var(--champ)}
.me .ibtn{background:rgba(255,255,255,.08);color:#e7d3dc}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:linear-gradient(135deg,#f0c9b4,#b76e79);color:#3a1d33;flex-shrink:0}
.content{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:12px;padding:calc(var(--st) + 14px) 24px 14px;background:var(--surface);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);flex-shrink:0}
.topbar h1{margin:0;font-size:23px;flex:1}
.topbar .av{width:36px;height:36px;display:none}
.net{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:rgba(201,131,26,.14);color:var(--warn)}
#view{flex:1;overflow-y:auto;padding:22px 24px 30px;-webkit-overflow-scrolling:touch}
#view.flush{padding:0;overflow:hidden}
.tabbar{display:none}
@media(max-width:899px){
  .side{display:none}
  .topbar{padding:calc(var(--st) + 10px) 16px 10px;background:linear-gradient(135deg,#3a1d33,#6a2f58 70%,#8a4a5e);color:#fff;border:0}
  .topbar h1{font-size:20px}
  .topbar .av{display:grid}
  #view{padding:14px 14px 22px}
  .tabbar{display:flex;background:var(--solid);border-top:1px solid var(--line);padding-bottom:var(--sb);flex-shrink:0}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:10.5px;font-weight:500;color:var(--muted);position:relative}
  .tabbar button.on{color:var(--pri);font-weight:700}
  .tabbar svg{width:23px;height:23px}
  .tabbar .badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--rose);color:#fff;font-size:10px;font-weight:700;border-radius:999px;padding:0 5px}
  .g2,.g3{grid-template-columns:1fr}
}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.search{position:relative;flex:1;min-width:200px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px}
.search input{padding-left:38px}
.sum-line{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13.5px;color:var(--muted);margin:0 2px 12px}
.sum-line b{color:var(--ink)}

/* ===== Thu ngân ===== */
.pos{display:grid;grid-template-columns:1fr 400px;height:100%}
.pos-l{display:flex;flex-direction:column;min-width:0;min-height:0}
.pos-tools{padding:14px 20px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.tickets{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tickets::-webkit-scrollbar{display:none}
.tk{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:8px 13px;border-radius:14px;background:var(--solid);border:1px solid var(--line);min-width:118px;text-align:left}
.tk b{font-size:13.5px;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk small{font-size:11.5px;color:var(--muted)}
.tk.on{background:linear-gradient(135deg,#8c4466,#b76e79);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(140,68,102,.3)}
.tk.on small{color:rgba(255,255,255,.85)}
.tk.new{justify-content:center;align-items:center;border-style:dashed;color:var(--rose);font-weight:600;min-width:auto}
.appt-hint{display:flex;align-items:center;gap:8px;font-size:13px;padding:8px 12px;border-radius:12px;background:var(--surface2);color:var(--ink);text-align:left}
.appt-hint b{color:var(--rose)}
.sgrid-s{flex:1;overflow-y:auto;padding:16px 20px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));grid-auto-rows:max-content;gap:12px;align-content:start}
.scard{position:relative;display:flex;gap:11px;align-items:center;background:var(--surface);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;transition:transform .1s,box-shadow .15s}
.scard:hover{box-shadow:var(--sh);transform:translateY(-2px)}
.scard:active{transform:scale(.98)}
.sic{width:46px;height:46px;border-radius:14px;flex-shrink:0;display:grid;place-items:center;font-size:23px;background:var(--c);background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.7),transparent 60%),linear-gradient(145deg,var(--c),color-mix(in srgb,var(--c) 55%,#3a1d33))}
.sinfo{min-width:0;flex:1}
.sinfo>span{display:block}
.sname{font-weight:600;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ssub{font-size:12px;color:var(--muted)}
.sprice{font-weight:700;color:var(--rose);font-size:14.5px}
.scard .cnt{position:absolute;top:-6px;right:-6px;background:var(--rose);color:#fff;font-size:11.5px;font-weight:700;min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;padding:0 6px;box-shadow:0 2px 6px rgba(183,110,121,.5)}
.scard.off{opacity:.45}
.pos-r{background:var(--surface);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.cart-h{display:flex;align-items:center;gap:10px;padding:16px 18px 10px}
.cart-h h2{margin:0;font-size:22px}
.cart-h small{color:var(--muted)}
.cust{display:flex;align-items:center;gap:10px;margin:0 18px 8px;padding:10px 12px;border-radius:14px;border:1px dashed var(--line);cursor:pointer;text-align:left;background:var(--solid)}
.cust:hover{border-color:var(--rose)}
.cust>svg{color:var(--rose)}
.cust b{display:block;font-size:14px}
.cust small{color:var(--muted);font-size:12px}

const IDB = (() => {
  let db;
  const open = () => new Promise((res, rej) => {
    const r = indexedDB.open('beauty-pos', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => { db = r.result; res(); };
    r.onerror = () => rej(r.error || new Error('IndexedDB'));
  });
  const tx = (mode, fn) => new Promise((res, rej) => {
    const t = db.transaction('kv', mode); const r = fn(t.objectStore('kv'));
    t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
  return { open, get: k => tx('readonly', s => s.get(k)), set: (k, v) => tx('readwrite', s => s.put(v, k)), clear: () => tx('readwrite', s => s.clear()) };
})();

async function verifyKey(key) {
  try {
    const m = String(key).replace(/\s+/g, '').match(/^BP1\.([A-Za-z0-9_-]+)\.([A-Za-z0-9_-]+)$/);
    if (!m) return { ok: false, why: 'Mã kích hoạt sai định dạng (phải bắt đầu bằng BP1.)' };
    const payload = b64uDec(m[1]), sig = b64uDec(m[2]);
    const pk = await crypto.subtle.importKey('jwk', LIC_PUB, { name: 'ECDSA', namedCurve: 'P-256' }, false, ['verify']);
    if (!(await crypto.subtle.verify({ name: 'ECDSA', hash: 'SHA-256' }, pk, sig, payload))) return { ok: false, why: 'Mã kích hoạt không hợp lệ' };
    const [tag, dev, expDays, plan] = new TextDecoder().decode(payload).split('|');
    if (tag !== 'BP') return { ok: false, why: 'Mã kích hoạt không dành cho Beauty POS' };
    if (dev !== LIC.dev) return { ok: false, why: 'Mã kích hoạt này dành cho máy khác (' + dev + ')' };
    return { ok: true, exp: +expDays ? +expDays * DAY : 0, plan };

const APP_ID = 'beauty-pos';

async function hashPw(pw, salt) {
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
  return hex(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: enc.encode(salt), iterations: 120000, hash: 'SHA-256' }, key, 256));
}

function completeSale(t, c, pay) {

/* ---- VietQR ---- */
const tlv = (id, v) => id + String(v.length).padStart(2, '0') + v;
function crc16(str) {
  let c = 0xFFFF;
  for (const b of new TextEncoder().encode(str)) { c ^= b << 8; for (let i = 0; i < 8; i++) c = c & 0x8000 ? ((c << 1) ^ 0x1021) & 0xFFFF : (c << 1) & 0xFFFF; }
  return c.toString(16).toUpperCase().padStart(4, '0');
}
function vietQRPayload(bin, acc, amount, info) {
  const mai = tlv('00', 'A000000727') + tlv('01', tlv('00', bin) + tlv('01', acc)) + tlv('02', 'QRIBFTTA');

const ordF = { q: '', r: 'today' };
const RANGES = [['today', 'Hôm nay'], ['yest', 'Hôm qua'], ['7d', '7 ngày'], ['month', 'Tháng này'], ['lmonth', 'Tháng trước'], ['all', 'Tất cả']];
function rangeOf(r, from, to) {
  const d0 = startOfDay(Date.now()), n = new Date();
  switch (r) {
    case 'today': return [d0, d0 + DAY]; case 'yest': return [addDays(d0, -1), d0];
    case '7d': return [addDays(d0, -6), d0 + DAY]; case 'month': return [+new Date(n.getFullYear(), n.getMonth(), 1), d0 + DAY];
    case 'lmonth': return [+new Date(n.getFullYear(), n.getMonth() - 1, 1), +new Date(n.getFullYear(), n.getMonth(), 1)];
    case 'custom': return [startOfDay(new Date(from + 'T00:00:00')), startOfDay(new Date(to + 'T00:00:00')) + DAY];
    default: return [0, Infinity];
  }
}

const repF = { r: '7d', from: isoDate(addDays(Date.now(), -6)), to: isoDate(Date.now()) };
function computeReport(a, b) {

    R.n++; R.rev += o.total; if (o.customerId) R.cust.add(o.customerId); add(R.method, o.method, o.total);
    for (const l of o.items) {
      const v = l.price * l.qty * ratio; R.cost += (l.cost || 0) * l.qty; R.comm += l.commAmt || 0; add(R.cat, l.cat, v);
      const it = R.item[l.name] || (R.item[l.name] = { q: 0, v: 0, cat: l.cat }); it.q += l.qty; it.v += v;
      if (l.techId) { const t = R.tech[l.techId] || (R.tech[l.techId] = { name: l.techName, v: 0, comm: 0, n: 0 }); t.v += v; t.comm += l.commAmt || 0; t.n += l.qty; }
    }
  }
  return R;
}
function vReports() {

  const a = a0 === 0 ? (S.orders.length ? startOfDay(S.orders[0].time) : startOfDay(Date.now())) : a0;
  const R = computeReport(a, b), span = b - a, mode = span <= DAY ? 'h' : span <= 62 * DAY ? 'd' : 'm';
  const bk = t => { const d = new Date(t); return mode === 'h' ? d.getHours() : mode === 'd' ? startOfDay(t) : d.getFullYear() * 12 + d.getMonth(); };
  S.orders.forEach(o => { if (!o.void && o.time >= a && o.time < b) R.ser[bk(o.time)] = (R.ser[bk(o.time)] || 0) + o.total; });
  let bars = [];

  else if (mode === 'd') { for (let t = a; t < b; t = addDays(t, 1)) bars.push([ddmm(t), R.ser[startOfDay(t)] || 0]); }
  else { const s = new Date(a), e = new Date(b - 1); for (let m = s.getFullYear() * 12 + s.getMonth(); m <= e.getFullYear() * 12 + e.getMonth(); m++) bars.push([(m % 12 + 1) + '/' + String(Math.floor(m / 12)).slice(2), R.ser[m] || 0]); }

  const techs = Object.entries(R.tech).sort((x, y) => y[1].v - x[1].v), top = Object.entries(R.item).sort((x, y) => y[1].q - x[1].q).slice(0, 10);

    <div class="kpis">

  checkout, openCart: () => $('#cartPanel').classList.add('open'), closeCart: () => $('#cartPanel').classList.remove('open'),
  zaloSend: d => zaloSend(d.id), zaloNative: d => zaloNative(d.id), zaloPick, zaloUse: d => { $('#zaloPhone').value = d.p; $('#zaloList').classList.add('hidden'); },
  reprint: d => { const o = S.orders.find(x => x.id === d.id); if (o) printReceipt(o); },
  ordR: d => { ordF.r = d.v; vOrders(); }, order: d => orderDetail(d.id), voidOrder: d => voidOrder(d.id),
  apDay: d => { apF.day = +d.v === 0 ? startOfDay(Date.now()) : startOfDay(addDays(apF.day, +d.v)); vAppts(); },
  editAppt: d => editAppt(d.id), apArrive: d => apArrive(d.id),
  apOpen: d => { const ap = S.appts.find(x => x.id === d.id); if (ap && S.tickets.some(t => t.id === ap.ticketId)) { curTk = ap.ticketId; go('pos'); } else { ap.status = 'booked'; apArrive(ap.id); } },
  apStatus: d => { const ap = S.appts.find(x => x.id === d.id); if (ap) { ap.status = d.v; save('appts'); refresh(); } },
  newCustomer: () => editCustomer(null), customer: d => editCustomer(d.id),
  svCat: d => { svF.cat = d.v; vServices(); }, editItem: d => editItem(d.id),
  repR: d => { repF.r = d.v; vReports(); }, exportCsv,
  editTech: d => editTech(d.id), editUser: d => editUser(d.id),
  saveShop: () => { const v = id => $('#' + id).value.trim();
    Object.assign(S.settings, { shopName: v('sShop') || S.settings.shopName, address: v('sAddr'), phone: v('sPhone'), footer: v('sFooter'),
      pointPer: Math.max(1000, Math.round(+v('sPoint') || 10000)), lowStock: Math.max(0, Math.round(+v('sLow') || 0)), lockMin: +$('#sLock').value });
    save('settings'); renderShell(); toast('Đã lưu thông tin salon'); },
  addCat: () => { const i = $('#catIn'), v = i.value.trim(); if (!v) return; if (S.settings.cats.includes(v)) return toast('Nhóm đã có', 'err'); S.settings.cats.push(v); save('settings'); vSettings(); },
  delCat: d => { if (S.items.some(i => i.cat === d.v)) return toast('Nhóm đang có dịch vụ, không xóa được', 'err'); S.settings.cats = S.settings.cats.filter(c => c !== d.v); save('settings'); vSettings(); },
  saveBank: () => { const acc = $('#sAcc').value.replace(/\s/g, '');
    if (acc && !/^[0-9A-Za-z]{4,19}$/.test(acc)) return toast('Số tài khoản không hợp lệ', 'err'); if (acc && !$('#sBank').value) return toast('Chọn ngân hàng', 'err');
    Object.assign(S.settings, { bankId: $('#sBank').value, bankAcc: acc, bankName: norm($('#sAccName').value.trim()).toUpperCase() }); save('settings'); toast('Đã lưu tài khoản ngân hàng'); return true; },
  testQR: () => { if (!A.saveBank()) return; if (!hasBank()) return toast('Chọn ngân hàng và nhập số tài khoản', 'err');
    openModal(`<div class="dlg-h"><h3>Mã QR thử · 10.000đ</h3><button class="ibtn" data-act="close">✕</button></div><div class="dlg-b"><p class="muted" style="margin-top:0">Mở app ngân hàng → Quét QR. Kiểm tra tên người nhận, <b>không cần chuyển</b>.</p>${qrBlock(10000, 'Thu QR')}</div>`, 'sm'); },
  backup: () => shareOrDownload(`beauty-pos_sao-luu_${isoDate(Date.now())}.json`, JSON.stringify({ app: 'beauty-pos', v: 1, at: Date.now(), data: Object.fromEntries(COLS.map(k => [k, S[k]])) }), 'application/json'),
  clearDemo: async () => {
    if (!(await ask('Xóa khách hàng, hóa đơn, lịch hẹn và KTV mẫu? Bảng giá dịch vụ, tài khoản và cài đặt được giữ lại để bạn chỉnh sửa.', 'Xóa dữ liệu mẫu', true))) return;
    Object.assign(S, { customers: [], orders: [], appts: [], tickets: [], techs: [] }); S.seq.order = 0; S.seq.ticket = 0; S.settings.demo = false; curTk = null;
    save('customers', 'orders', 'appts', 'tickets', 'techs', 'seq', 'settings'); toast('Đã xóa dữ liệu mẫu'); refresh();
  },
  wipe: async () => {
    if (!(await ask('Xóa <b>TOÀN BỘ</b> dữ liệu: dịch vụ, hóa đơn, khách hàng, tài khoản? Nên sao lưu trước.', 'Tiếp tục', true))) return;
    if (!(await ask('Chắc chắn? Thao tác này <b>không thể hoàn tác</b>.', 'Xóa vĩnh viễn', true))) return;
    await IDB.clear(); await licSave(); sessSet(null); location.reload();
  }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (el && ADMIN_ACTS.has(el.dataset.act) && !isAdmin()) { e.preventDefault(); return toast('Chức năng này chỉ dành cho Quản lý (Admin)', 'err'); }
  if (!el || el.disabled || !el.dataset.act) return;
  const fn = A[el.dataset.act]; if (fn) { e.preventDefault(); fn(el.dataset, el, e); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { const ms = $$('.modal'); if (ms.length && !ms[ms.length - 1].dataset.static) closeModal(); else if ($('#cartPanel')) $('#cartPanel').classList.remove('open'); }
  if (!ME || $$('.modal').length) return;
  if (e.key === 'F2' && cur === 'pos') { e.preventDefault(); $('#posQ').focus(); }
  if (e.key === 'F9' && cur === 'pos') { e.preventDefault(); checkout(); }
});
const netUpd = () => $('#net').classList.toggle('hidden', navigator.onLine);
window.addEventListener('online', netUpd); window.addEventListener('offline', netUpd);
setInterval(() => { if (ME && cur === 'pos' && !$$('.modal').length && $('#tkStrip')) renderStrip(); }, 60000);

/* ================= KHỞI ĐỘNG ================= */
(async function boot() {
  $('#bgDeco').innerHTML = LEAF('leaf lf1') + LEAF('leaf lf2') + LOTUS('leaf lotus', 1);
  if (!window.indexedDB || !window.crypto || !crypto.subtle) {
    document.body.insertAdjacentHTML('beforeend', '<div class="fatal"><h2>Trình duyệt chưa hỗ trợ</h2><p>Hãy mở bằng Safari, Chrome hoặc Edge bản mới qua địa chỉ <b>https://</b>, không dùng chế độ ẩn danh.</p></div>'); return;
  }
  try { await IDB.open(); await loadAll(); }
  catch (e) { document.body.insertAdjacentHTML('beforeend', `<div class="fatal"><h2>Không mở được bộ nhớ</h2><p>${esc(e.message)}. Hãy tắt chế độ ẩn danh hoặc thử trình duyệt khác.</p></div>`); return; }
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  netUpd();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
  await licLoad();
  await bkLoad(); setInterval(bkTick, 5 * 60000);
  if (!(await licCheck())) return;
  setInterval(() => { if (LST && LST.active) licCheck(); }, 10 * 60000);
  if (!S.users.length) return renderSetup();
  const ss = sessGet(), u = ss && S.users.find(x => x.id === ss.uid && x.active);
  if (u) { const m = +S.settings.lockMin; if (m > 0 && Date.now() - (ss.last || 0) > m * 60000) { ME = u; lockScreen(); } else login(u, false); }
  else renderLogin();
})();
</script>
</body>
</html>
