<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f5d50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Canteen POS">
<meta name="description" content="Phần mềm bán hàng & quản lý kho cho căn tin, cửa hàng tạp hóa trường học.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Baloo+2:wght@600;700;800&family=Patrick+Hand&display=swap" rel="stylesheet">
<title>Canteen POS</title>
<style>
:root{
  --bg:#fdfbf4;--surface:#fff;--surface2:#f2f5f8;--ink:#22313f;--muted:#6b7785;--line:#dfe6ee;
  --steel:#2f5d50;--steel2:#24493f;--yel:#ffcb2e;--org:#ff6b6b;
  --pri:#2f5d50;--pri-ink:#fff;--ok:#2f9e6e;--err:#e04848;--warn:#d08a0e;
  --r:12px;--sh:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(20,30,40,.07);
  --grid:rgba(70,140,210,.16);--grid2:rgba(255,107,107,.35);--art:#2f5d50;
  --st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom);
  --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --cond:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif;
  --chalk:"Patrick Hand","Comic Sans MS",cursive;
  --hz:repeating-linear-gradient(90deg,#ffcb2e 0 26px,#ff6b6b 26px 52px,#4fb3e8 52px 78px,#6cc070 78px 104px,#b58cff 104px 130px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121c18;--surface:#1a2622;--surface2:#22302b;--ink:#e8efe9;--muted:#9fb0a8;--line:#2e3d37;
    --pri:#ffcb2e;--pri-ink:#22313f;--sh:0 6px 20px rgba(0,0,0,.4);--grid:rgba(120,180,240,.07);--grid2:rgba(255,107,107,.2);--art:#9fd3c0}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--yel);box-shadow:0 0 0 3px rgba(245,183,0,.25)}
input:disabled,select:disabled{opacity:.6}
h1,h2,h3{font-family:var(--cond);font-weight:800;letter-spacing:.2px}
.hidden{display:none!important}
.grow{flex:1}.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.f{margin-bottom:12px}
.f>label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px}
.err-t{color:var(--err)}.ok-t{color:var(--ok)}
.num{font-variant-numeric:tabular-nums}
svg.i{width:20px;height:20px;flex-shrink:0}
.hazard{height:6px;background:var(--hz)}

/* ===== Nền giấy vở học sinh ===== */
.bg-art{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background-color:var(--bg);
  background-image:linear-gradient(90deg,transparent 0 63px,var(--grid2) 63px 65px,transparent 65px),repeating-linear-gradient(transparent 0 27px,var(--grid) 27px 28px);
  background-size:100% 100%,100% 28px}
.bg-art .crane{position:absolute;right:2%;bottom:70px;width:min(420px,40vw);color:var(--art);opacity:.13}
.bg-art .sky{position:absolute;left:0;right:0;bottom:0;width:100%;height:150px;color:var(--art);opacity:.13}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:10px;font-weight:600;background:var(--surface2);transition:transform .08s,filter .15s;white-space:nowrap}
.btn:hover{filter:brightness(.96)}.btn:active{transform:scale(.97)}
.btn.pri{background:var(--pri);color:var(--pri-ink)}
.zalo-link{background:none;border:0;color:#0068ff;font-weight:600;font-size:13.5px;padding:8px 0 0;cursor:pointer;text-align:left}
.zalo-list{margin-top:6px;border:1px solid rgba(128,128,128,.28);border-radius:12px;background:var(--surface);max-height:190px;overflow:auto}
.zalo-list .zi{display:flex;justify-content:space-between;gap:10px;width:100%;padding:10px 12px;text-align:left;border-bottom:1px solid rgba(128,128,128,.18);font-size:14px}
.zalo-list .zi:last-child{border:0}.zalo-list .zi span{color:var(--muted);white-space:nowrap}
.zalo-list .zi b{overflow:hidden;text-overflow:ellipsis}
.btn.zalo{background:#0068ff;color:#fff;white-space:nowrap}
.cart-f .row .btn kbd{display:none}
@media(max-width:560px){.cart-f .qt{display:none}}
.zalo-box{margin:0 20px 14px;padding:10px 12px;border-radius:14px;background:var(--surface2)}
.zalo-box .small{font-size:12px;margin:6px 0 0}
.btn.yel{background:linear-gradient(180deg,#ffd84d,#ffc21a);color:#22313f;box-shadow:0 4px 0 #d9a100,0 6px 14px rgba(255,194,26,.35);border-radius:12px}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:var(--err);color:#fff}
.btn.danger.ghost{background:transparent;color:var(--err);border-color:rgba(214,69,69,.35)}
.btn.sm{padding:7px 12px;font-size:13.5px;border-radius:9px}
.btn.block{width:100%}
.ibtn{width:38px;height:38px;border-radius:10px;display:inline-grid;place-items:center;background:var(--surface2)}
kbd{font:600 11px var(--sans);background:rgba(0,0,0,.12);padding:2px 6px;border-radius:5px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;padding:7px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;font-weight:500}
.chip.on{background:var(--steel);color:#fff;border-color:var(--steel);box-shadow:0 3px 0 #ffcb2e}
.chip button{font-size:11px;opacity:.7;margin-left:2px}
.chip-add{display:inline-flex;border:1px dashed var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.chip-add input{border:0;padding:6px 10px;font-size:14px;width:130px;background:transparent;box-shadow:none}
.chip-add button{padding:0 12px;font-weight:700;color:var(--org)}
.seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px}
.seg button{padding:8px 14px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.seg.sm button{padding:5px 10px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.tag.ok{background:rgba(47,158,110,.13);color:var(--ok)}
.tag.err{background:rgba(214,69,69,.12);color:var(--err)}
.tag.yel{background:rgba(245,183,0,.2);color:#8a6400}
.tag.blue{background:rgba(70,120,210,.13);color:#3e6fc2}
.tag.org{background:rgba(255,122,0,.14);color:#b85500}
@media (prefers-color-scheme:dark){.tag.yel{color:#f5c84a}.tag.org{color:#ffa65a}}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);padding:18px;border:1px solid var(--line)}
.card h3{margin:0 0 12px;font-size:22px;color:var(--steel)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.empty svg{width:44px;height:44px;opacity:.4}

/* ===== Đăng nhập ===== */
#auth{position:fixed;inset:0;z-index:30;overflow-y:auto}
.auth{position:relative;min-height:100%;display:grid;grid-template-columns:1.15fr 1fr;grid-template-rows:1fr auto;isolation:isolate;overflow:hidden;color:#fff;
  background-color:#2c5a4c;border:16px solid #9a6534;border-image:linear-gradient(135deg,#b97a40,#7a4a22 40%,#a8703a 70%,#6d4120) 1;
  background-image:radial-gradient(ellipse at 20% 15%,rgba(255,255,255,.08),transparent 45%),radial-gradient(ellipse at 80% 85%,rgba(255,255,255,.06),transparent 50%),
    radial-gradient(circle at 50% 50%,rgba(0,0,0,0),rgba(0,0,0,.35) 100%),repeating-linear-gradient(115deg,rgba(255,255,255,.012) 0 3px,transparent 3px 9px)}
.auth::after{content:"";position:absolute;left:8%;right:8%;bottom:0;height:12px;background:linear-gradient(180deg,#b97a40,#6d4120);border-radius:4px 4px 0 0;box-shadow:0 -2px 6px rgba(0,0,0,.3);z-index:-1}
.auth::before{content:"";position:absolute;left:14%;bottom:12px;width:46px;height:9px;border-radius:3px;background:#f4f1e8;box-shadow:70px 0 0 #ffe27a,140px 0 0 #ffb3c1,0 2px 3px rgba(0,0,0,.4);z-index:-1}
.auth .crane{position:absolute;left:34%;bottom:120px;width:min(460px,34%);color:#ffe27a;opacity:.55;z-index:-1}
.auth .sky{position:absolute;left:0;bottom:24px;width:100%;height:170px;color:#f4f1e8;opacity:.32;z-index:-1}
.auth .tblock{position:absolute;right:26px;top:26px;width:190px;padding:14px 14px 12px;background:linear-gradient(180deg,#fff59a,#ffe45c);color:#3b3a1e;font:20px/1.25 var(--chalk);transform:rotate(3deg);box-shadow:0 10px 18px rgba(0,0,0,.35);z-index:0}
.auth .tblock::before{content:"";position:absolute;top:-10px;left:50%;width:60px;height:20px;margin-left:-30px;background:rgba(255,255,255,.55);transform:rotate(-4deg)}
.auth .tblock div{padding:1px 0}
.auth-art{padding:64px 56px;display:flex;flex-direction:column;justify-content:center}
.brand-lg{display:flex;align-items:center;gap:14px;margin-bottom:36px}
.brand-lg svg{width:60px;height:60px}
.brand-lg .bn{font:800 32px/1.1 var(--cond);letter-spacing:.3px}
.brand-lg .bt{font-size:12px;letter-spacing:3.5px;text-transform:uppercase;color:#ffe27a}
.auth-art h2{font:400 58px/1.05 var(--chalk);margin:0 0 14px;max-width:560px;color:#f7f5ee;text-shadow:0 0 1px rgba(255,255,255,.6),0 2px 0 rgba(0,0,0,.18)}
.auth-art h2 em{font-style:normal;color:#ffe27a}
.auth-art p{margin:0;color:rgba(255,255,255,.8);font-size:16px;max-width:470px}
.svcs{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px;max-width:540px}
.svcs span{border:2px dashed rgba(244,241,232,.55);background:rgba(255,255,255,.04);color:#f7f5ee;padding:6px 14px;border-radius:999px;font:18px var(--chalk)}
.auth-side{display:flex;align-items:center;justify-content:center;padding:40px 24px calc(40px + var(--sb))}
.auth-card{width:100%;max-width:420px;color:#22313f;border-radius:14px;padding:0 0 26px;box-shadow:0 30px 80px rgba(0,0,0,.5);overflow:hidden;background:#fffef8 linear-gradient(90deg,transparent 0 22px,rgba(255,107,107,.45) 22px 24px,transparent 24px),#fffef8;background-image:linear-gradient(90deg,transparent 0 22px,rgba(255,107,107,.45) 22px 24px,transparent 24px),repeating-linear-gradient(#fffef8 0 27px,rgba(70,140,210,.18) 27px 28px)}
.auth-card>.hazard{height:10px;margin-bottom:24px}
.auth-card>*:not(.hazard){margin-left:28px;margin-right:28px}
.auth-card h1{font-size:38px;margin-top:0;margin-bottom:4px;color:#2f5d50}
.auth-card .lead{color:#66717d;margin-top:0;margin-bottom:22px}
.auth-card input,.auth-card textarea{background:#fff;color:#1d232a;border-color:#d5dae0}
.auth-card textarea{font:14px ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.auth-card .f>label{color:#66717d}
.pw{position:relative}.pw input{padding-right:46px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;display:grid;place-items:center;color:var(--muted)}
.auth-msg{min-height:22px;font-size:14px;color:var(--err);margin:4px 0 10px}
.check{display:flex;align-items:center;gap:9px;font-size:14px;margin:6px 0 16px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:#1d232a}
.lock-user{display:flex;align-items:center;gap:12px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:16px}
.auth-card .lock-user{background:#f1f3f5;border-color:#dde1e6}
.auth-foot{margin-top:22px;font-size:12.5px;color:#66717d;text-align:center}
.link{color:#2f8f6f;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.devcode{font:700 21px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:2px;text-align:center;padding:14px;border-radius:10px;background:rgba(255,203,46,.16);border:1.5px dashed #d9a100;user-select:all;-webkit-user-select:all}
@media(max-width:899px){
  .auth{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}
  .auth-art{padding:calc(var(--st) + 34px) 22px 8px}
  .brand-lg{margin-bottom:18px}.svcs{margin-top:14px}.svcs span{font-size:12.5px;padding:5px 10px}
  .auth{border-width:10px}.auth .crane{width:70%;left:28%;bottom:auto;top:40px;opacity:.2}.auth .tblock{display:none}.auth-art h2{font-size:40px}
  .auth-side{align-items:flex-start;padding-top:18px}
  .auth-card>*:not(.hazard){margin-left:20px;margin-right:20px}
}

/* ===== Khung ứng dụng ===== */
#app{position:relative;z-index:1;display:flex;height:100dvh}
.side{position:relative;overflow:hidden;width:250px;flex-shrink:0;background:radial-gradient(ellipse at 30% 10%,rgba(255,255,255,.07),transparent 60%),linear-gradient(180deg,#2f5d50,#23463c);color:#e3ece7;border-right:8px solid #9a6534;display:flex;flex-direction:column;padding:calc(var(--st) + 20px) 14px 16px}
.side::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;background:var(--hz)}
.side .side-art{position:absolute;left:-10px;bottom:80px;width:260px;color:#f4f1e8;opacity:.12;pointer-events:none}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px 20px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:14px}
.brand svg{width:44px;height:44px;flex-shrink:0}
.brand b{display:block;font:800 20px/1.1 var(--cond);color:#fff;letter-spacing:.2px}
.brand small{font-size:10.5px;letter-spacing:2.5px;text-transform:uppercase;color:#ffe27a}
.nav{display:flex;flex-direction:column;gap:3px;position:relative}
.nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:9px;font-weight:500;color:#dce8e2;text-align:left;border-left:3px solid transparent}
.nav button:hover{background:rgba(255,255,255,.05);color:#fff}
.nav button.on{background:rgba(255,226,122,.14);color:#ffe27a;border-left-color:#ffcb2e;font-family:var(--chalk);font-size:19px}
.nav .badge{margin-left:auto;background:#ff6b6b;color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px}
.me{position:relative;margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 8px 0;border-top:1px solid rgba(255,255,255,.08)}
.me .who{flex:1;min-width:0}
.me .who b{display:block;color:#fff;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .who small{font-size:12px;color:#ffe27a}
.me .ibtn{background:rgba(255,255,255,.08);color:#cfd6de}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:#ffcb2e;color:#22313f;flex-shrink:0}
.content{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:12px;padding:calc(var(--st) + 12px) 24px 12px;background:var(--surface);border-bottom:1px solid var(--line);flex-shrink:0}
.topbar h1{margin:0;font-size:28px;flex:1;color:var(--steel)}
.topbar .av{width:36px;height:36px;display:none}
.trial{font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:6px;background:var(--yel);color:#1d232a;white-space:nowrap}
.trial.urgent{background:var(--err);color:#fff}
.net{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:rgba(194,124,14,.14);color:var(--warn)}
#view{flex:1;overflow-y:auto;padding:20px 24px 30px;-webkit-overflow-scrolling:touch}
#view.flush{padding:0;overflow:hidden}
.tabbar{display:none}
@media(max-width:899px){
  .side{display:none}
  .topbar{position:relative;padding:calc(var(--st) + 10px) 16px 12px;background:linear-gradient(180deg,#2f5d50,#24493f);color:#fff;border:0}
  .topbar h1{color:#fff}
  .topbar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--hz)}
  .topbar h1{font-size:22px}.topbar .av{display:grid}
  #view{padding:14px 14px 22px}
  .tabbar{display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:var(--sb);flex-shrink:0}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:10.5px;font-weight:500;color:var(--muted);position:relative}
  .tabbar button.on{color:var(--ink);font-weight:700}
  .tabbar button.on svg{color:#2f8f6f}
  .tabbar svg{width:23px;height:23px}
  .tabbar .badge{position:absolute;top:4px;left:calc(50% + 6px);background:#ff6b6b;color:#fff;font-size:10px;font-weight:700;border-radius:999px;padding:0 5px}
  .g2,.g3{grid-template-columns:1fr}
}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.search{position:relative;flex:1;min-width:200px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px}
.search input{padding-left:38px}
.sum-line{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13.5px;color:var(--muted);margin:0 2px 12px}
.sum-line b{color:var(--ink)}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.tabs button{padding:10px 16px;font:700 18px var(--cond);letter-spacing:.2px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--yel)}

/* ===== Bán hàng ===== */
.pos{display:grid;grid-template-columns:1fr 410px;height:100%}
.pos-l{display:flex;flex-direction:column;min-width:0;min-height:0}
.pos-tools{padding:14px 20px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 80%,transparent)}
.tickets{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.tickets::-webkit-scrollbar{display:none}
.tk{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:8px 13px;border-radius:9px;background:var(--surface);border:1px solid var(--line);min-width:120px;text-align:left}
.tk b{font-size:13.5px;max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk small{font-size:11.5px;color:var(--muted)}
.tk.on{background:var(--steel);color:#fff;border-color:var(--steel);box-shadow:0 4px 0 var(--yel)}
.tk.on small{color:#cfd6de}
.tk.new{justify-content:center;align-items:center;border-style:dashed;color:var(--org);font-weight:700;min-width:auto}
.plist{flex:1;overflow-y:auto;padding:14px 20px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));grid-auto-rows:max-content;gap:10px;align-content:start}
.pc{position:relative;display:flex;gap:11px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 12px;text-align:left;transition:transform .1s,box-shadow .15s;border-left:4px solid var(--c)}
.pc:hover{box-shadow:var(--sh)}.pc:active{transform:scale(.985)}
.pc-ic{width:44px;height:44px;border-radius:12px;flex-shrink:0;display:grid;place-items:center;font-size:24px;background:var(--surface2);overflow:hidden}
.pc-ic img{width:100%;height:100%;object-fit:cover;display:block}
.pc .pc-ic{width:58px;height:58px;font-size:28px}

function readImage(file) {
  return new Promise((res, rej) => {
    if (!file || !/^image\//.test(file.type)) return rej(new Error('File không phải hình ảnh'));
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const z = Math.min(im.width, im.height), N = 240, c = document.createElement('canvas'); c.width = c.height = N;
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, N, N);
      g.drawImage(im, (im.width - z) / 2, (im.height - z) / 2, z, z, 0, 0, N, N); URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.82));
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Không đọc được ảnh')); };
    im.src = url;
  });
}

/* ---- VietQR ---- */
const tlv = (id, v) => id + String(v.length).padStart(2, '0') + v;
function crc16(str) { let c = 0xFFFF; for (const b of new TextEncoder().encode(str)) { c ^= b << 8; for (let i = 0; i < 8; i++) c = c & 0x8000 ? ((c << 1) ^ 0x1021) & 0xFFFF : (c << 1) & 0xFFFF; } return c.toString(16).toUpperCase().padStart(4, '0'); }
function vietQRPayload(bin, acc, amount, info) {
  const mai = tlv('00', 'A000000727') + tlv('01', tlv('00', bin) + tlv('01', acc)) + tlv('02', 'QRIBFTTA');
  const memo = norm(info || '').toUpperCase().replace(/[^A-Z0-9 ]/g, '').trim().slice(0, 25);
  const s = tlv('00', '01') + tlv('01', amount ? '12' : '11') + tlv('38', mai) + tlv('53', '704') + (amount ? tlv('54', String(Math.round(amount))) : '') + tlv('58', 'VN') + (memo ? tlv('62', tlv('08', memo)) : '') + '6304';
  return s + crc16(s);
}
const hasBank = () => !!(S.settings.bankId && S.settings.bankAcc);
function qrSvg(amount, info) { const q = qrcode(0, 'M'); q.addData(vietQRPayload(S.settings.bankId, S.settings.bankAcc, amount, info)); q.make(); return q.createSvgTag({ cellSize: 4, margin: 4, scalable: true }); }
const qrBlock = (amount, info) => `<div class="qrbox">${qrSvg(amount, info)}<div class="qa">${fmt(amount)}</div><div class="qi"><b>${esc(bankLabel(S.settings.bankId))}</b> · ${esc(S.settings.bankAcc)}<br>${esc(S.settings.bankName)}</div></div>`;

const zaloLoadImg = src => new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('img')); im.src = src; });
async function zaloImage(d) {

    hr(false);
    y += 18; txt(d.title, W / 2, `700 18px ${FAM}`, AC, 'center');
    if (d.sub) { y += 20; txt(d.sub, W / 2, `italic 13.5px ${FAM}`, '#777', 'center'); }

    d.party.forEach(([k, v]) => { y += 20; wrapLines(`${k}: ${v}`, `14px ${FAM}`, W - 2 * M).forEach((t, i) => { if (i) y += 18; txt(t, W / 2, `14px ${FAM}`, '#555', 'center'); }); });
    y += 6; hr(true);
    for (const l of d.lines) {
      const nm = wrapLines(l.name, `600 16px ${FAM}`, W - 2 * M - 120);
      nm.forEach((t, i) => { y += 22; txt(t, M, `600 16px ${FAM}`, '#1c1c1c'); if (i === 0) txt(l.amount, R_, `600 16px ${FAM}`, '#1c1c1c', 'right'); });
      y += 19; txt(l.sub, M, `13.5px ${FAM}`, '#777'); y += 4;
    }

    if (qr) {

function createImport({ supplierId, lines, paid, note }, time, by) {
  const s = supOf(supplierId), tm = time || Date.now();
  const x = { id: uid(), code: nextCode('imp', 'PN'), time: tm, supplierId: s ? s.id : null, supplierName: s ? s.name : '', note: note || '', by: by || ME.name,
    items: lines.map(l => { const p = prodOf(l.pid); return { pid: l.pid, name: p.name, unit: p.unit, qty: l.qty, cost: l.cost, amount: Math.round(l.qty * l.cost), exp: l.exp || '' }; }) };
  x.total = x.items.reduce((a, i) => a + i.amount, 0); x.paid = Math.min(paid, x.total);
  for (const i of x.items) { const p = prodOf(i.pid), old = Math.max(0, p.stock); p.cost = Math.round(old + i.qty > 0 ? (old * (p.cost || 0) + i.qty * i.cost) / (old + i.qty) : i.cost); if (i.exp) p.exp = old > 0 && p.exp && p.exp < i.exp ? p.exp : i.exp; move(i.pid, i.qty, 'N', x.code, tm); }
  if (s) { s.debt = (s.debt || 0) + x.total - x.paid; s.bought = (s.bought || 0) + x.total; }
  S.imports.push(x); save('imports', 'products', 'moves', 'suppliers', 'seq'); return x;
}

  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

      rows80: R.map(r => [esc(r.p.name), `Đầu ${fq(r.start)} +${fq(r.nhap)} -${fq(r.xuat)}`, fq(r.end) + ' ' + esc(r.p.unit)]),
      totals: [['Giá trị tồn cuối kỳ', fmt(R.reduce((s, r) => s + r.val, 0)), 1]], sigs: ['Thủ kho', 'Kế toán', 'Quản lý'] }); },
  csvDebt: () => shareOrDownload(`cong-no-khach_${isoDate(Date.now())}.csv`, csv([['Khách hàng', 'SĐT', 'Địa chỉ', 'Nhóm', 'Công nợ'], ...S.customers.filter(c => c.debt).map(c => [c.name, c.phone, c.addr, c.group === 'si' ? 'GV/NV' : 'Lẻ', c.debt])]), 'text/csv'),
  editUser: d => editUser(d.id),
  saveShop: () => { const v = id => $('#' + id).value.trim();
    Object.assign(S.settings, { shopName: v('sShop') || S.settings.shopName, address: v('sAddr'), phone: v('sPhone'), taxCode: v('sTax'), footer: v('sFooter'), printSize: $('#sPrint').value, lockMin: +$('#sLock').value, hsdWarn: +$('#sHsd').value || 7, allowNeg: $('#sNeg').checked });
    save('settings'); renderShell(); toast('Đã lưu thông tin cửa hàng'); },
  addCat: () => { const v = $('#catIn').value.trim(); if (!v) return; if (S.settings.cats.includes(v)) return toast('Nhóm đã có', 'err'); S.settings.cats.push(v); save('settings'); vSettings(); },
  delCat: d => { if (S.products.some(p => p.cat === d.v)) return toast('Nhóm đang có hàng hóa, không xóa được', 'err'); S.settings.cats = S.settings.cats.filter(c => c !== d.v); save('settings'); vSettings(); },
  addUnit: () => { const v = $('#unitIn').value.trim(); if (!v) return; if (S.settings.units.includes(v)) return toast('ĐVT đã có', 'err'); S.settings.units.push(v); save('settings'); vSettings(); },
  delUnit: d => { if (S.products.some(p => p.unit === d.v || p.unit2 === d.v)) return toast('ĐVT đang được dùng, không xóa được', 'err'); S.settings.units = S.settings.units.filter(c => c !== d.v); save('settings'); vSettings(); },
  saveBank: () => { const acc = $('#sAcc').value.replace(/\s/g, '');
    if (acc && !/^[0-9A-Za-z]{4,19}$/.test(acc)) return toast('Số tài khoản không hợp lệ', 'err'); if (acc && !$('#sBank').value) return toast('Chọn ngân hàng', 'err');
    Object.assign(S.settings, { bankId: $('#sBank').value, bankAcc: acc, bankName: norm($('#sAccName').value.trim()).toUpperCase() }); save('settings'); toast('Đã lưu tài khoản ngân hàng'); return true; },
  testQR: () => { if (!A.saveBank()) return; if (!hasBank()) return toast('Chọn ngân hàng và nhập số tài khoản', 'err');
    openModal(`<div class="dlg-h"><h3>Mã QR thử · 10.000đ</h3><button class="ibtn" data-act="close">✕</button></div><div class="dlg-b"><p class="muted" style="margin-top:0">Mở app ngân hàng → Quét QR. Kiểm tra tên người nhận, <b>không cần chuyển</b>.</p>${qrBlock(10000, 'Thu QR')}</div>`, 'sm'); },
  backup: () => shareOrDownload(`canteen-pos_sao-luu_${isoDate(Date.now())}.json`, JSON.stringify({ app: 'canteen-pos', v: 1, at: Date.now(), data: Object.fromEntries(COLS.map(k => [k, S[k]])) }), 'application/json'),
  clearDemo: async () => {
    if (!(await ask('Xóa hóa đơn, phiếu nhập/xuất, khách hàng, NCC mẫu và đưa tồn kho về 0? Danh mục hàng hóa, tài khoản và cài đặt được giữ lại.', 'Xóa dữ liệu mẫu', true))) return;
    Object.assign(S, { customers: [], suppliers: [], orders: [], imports: [], issues: [], payments: [], moves: [], tickets: [] });
    S.products.forEach(p => { p.stock = 0; p.cost = 0; }); Object.assign(S.seq, { order: 0, imp: 0, iss: 0, pay: 0, tk: 0 }); S.settings.demo = false; curTk = null;
    save(...COLS); toast('Đã xóa dữ liệu mẫu'); refresh();
  },
  wipe: async () => {
    if (!(await ask('Xóa <b>TOÀN BỘ</b> dữ liệu: hàng hóa, hóa đơn, kho, công nợ, tài khoản? Nên sao lưu trước.', 'Tiếp tục', true))) return;
    if (!(await ask('Chắc chắn? Thao tác này <b>không thể hoàn tác</b>.', 'Xóa vĩnh viễn', true))) return;
    await IDB.clear(); await licSave(); sessSet(null); location.reload();
  }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled || !el.dataset.act) return;
  const fn = A[el.dataset.act]; if (fn) { e.preventDefault(); fn(el.dataset, el, e); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { const ms = $$('.modal'); if (ms.length && !ms[ms.length - 1].dataset.static) closeModal(); else if ($('#cartPanel')) $('#cartPanel').classList.remove('open'); }
  if (!ME || $$('.modal').length) return;
  if (e.key === 'F2' && cur === 'pos') { e.preventDefault(); $('#posQ').focus(); }
  if (e.key === 'F9' && cur === 'pos') { e.preventDefault(); checkout(); }
});
const netUpd = () => $('#net').classList.toggle('hidden', navigator.onLine);
window.addEventListener('online', netUpd); window.addEventListener('offline', netUpd);

/* ================= KHỞI ĐỘNG ================= */
(async function boot() {
  $('#bgArt').innerHTML = craneSVG('crane') + skylineSVG('sky');
  if (!window.indexedDB || !window.crypto || !crypto.subtle) { document.body.insertAdjacentHTML('beforeend', '<div class="fatal"><h2>Trình duyệt chưa hỗ trợ</h2><p>Hãy mở bằng Safari, Chrome hoặc Edge bản mới qua địa chỉ <b>https://</b>, không dùng chế độ ẩn danh.</p></div>'); return; }
  try { await IDB.open(); await loadAll(); }
  catch (e) { document.body.insertAdjacentHTML('beforeend', `<div class="fatal"><h2>Không mở được bộ nhớ</h2><p>${esc(e.message)}. Hãy tắt chế độ ẩn danh hoặc thử trình duyệt khác.</p></div>`); return; }
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  netUpd();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
  await licLoad();
  await bkLoad(); setInterval(bkTick, 5 * 60000);
  if (!(await licCheck())) return;
  setInterval(() => { if (LST && LST.active) licCheck(); }, 10 * 60000);
  if (!S.users.length) return renderSetup();
  const ss = sessGet(), u = ss && S.users.find(x => x.id === ss.uid && x.active);
  if (u) { const m = +S.settings.lockMin; if (m > 0 && Date.now() - (ss.last || 0) > m * 60000) { ME = u; lockScreen(); } else login(u, false); }
  else renderLogin();
})();
</script>
</body>
</html>
