<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#3b2418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cà Phê POS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<title>Cà Phê POS</title>
<style>
:root{
  --bg:#f6f1eb;--surface:#fff;--surface2:#f1e8de;--text:#2a1d16;--muted:#8a7668;
  --primary:#6f4e37;--primary2:#8b5e3c;--ink:#fff;--accent:#d98e3a;
  --busy1:#e98a3c;--busy2:#c8612a;--ok:#2e9e6a;--danger:#d64545;--border:#e8ddd1;
  --shadow:0 2px 10px rgba(60,35,20,.08);--radius:16px;
  --st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#15100c;--surface:#211913;--surface2:#2c221b;--text:#f3e9df;--muted:#a8968a;
    --primary:#c8935f;--primary2:#b07b48;--ink:#1a120d;--border:#3a2e25;--shadow:0 2px 10px rgba(0,0,0,.35)}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  display:flex;flex-direction:column;height:100dvh;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;font-size:16px;color:var(--text);background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:11px 12px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--primary)}
.hidden{display:none!important}

/* Header */
.top{background:linear-gradient(135deg,#3b2418,#6f4e37);color:#fff;padding:calc(var(--st) + 10px) 16px 12px;flex-shrink:0}
.top h1{margin:0;font-size:19px;letter-spacing:.2px}
.top .sub{font-size:12.5px;opacity:.8;margin-top:2px}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.clock{font-variant-numeric:tabular-nums;font-size:13px;background:rgba(255,255,255,.15);padding:5px 10px;border-radius:20px}

main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px calc(20px)}
.tabbar{display:flex;background:var(--surface);border-top:1px solid var(--border);padding-bottom:var(--sb);flex-shrink:0}
.tabbar button{flex:1;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted)}
.tabbar button.on{color:var(--primary);font-weight:600}
.tabbar svg{width:24px;height:24px}

/* Common */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:8px 14px;border-radius:20px;background:var(--surface);border:1px solid var(--border);font-size:14px}
.chip.on{background:var(--primary);color:var(--ink);border-color:var(--primary);font-weight:600}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.btn{padding:12px 16px;border-radius:12px;background:var(--surface2);font-weight:600;text-align:center}
.btn.pri{background:var(--primary);color:var(--ink)}
.btn.ok{background:var(--ok);color:#fff}
.btn.danger{background:var(--danger);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--border)}
.btn:active,.tcard:active,.mcard:active{transform:scale(.97)}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1}
.muted{color:var(--muted)}
.sec-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:18px 2px 8px}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 5px}

/* Tables */
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--surface);border-radius:14px;padding:11px 13px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;margin-top:12px}
.tcard{position:relative;background:var(--surface);border:1.5px dashed var(--border);border-radius:14px;min-height:92px;
  padding:9px;display:flex;flex-direction:column;align-items:flex-start;text-align:left;transition:transform .08s}
.tcard .tnum{font-size:24px;font-weight:800;line-height:1;color:var(--primary);font-variant-numeric:tabular-nums}
.tcard .tlabel{font-size:12px;color:var(--muted);margin-top:2px}
.tcard .tfree{margin-top:auto;font-size:12px;color:var(--ok);font-weight:600}
.tcard.busy{background:linear-gradient(145deg,var(--busy1),var(--busy2));border:0;color:#fff;box-shadow:0 4px 14px rgba(200,97,42,.35)}
.tcard.busy .tnum,.tcard.busy .tlabel{color:#fff}
.tcard .tamt{margin-top:auto;font-weight:700;font-size:13.5px;font-variant-numeric:tabular-nums}
.tcard .ttime{font-size:10.5px;opacity:.9}
.tcard.wide{grid-column:1/-1;min-height:64px;flex-direction:row;align-items:center;gap:12px;border-style:solid}
.tcard.wide .tnum{font-size:26px}
.tcard.wide .tlabel{font-size:15px;font-weight:600;margin:0}
.tcard.wide .tfree,.tcard.wide .tamt{margin:0 0 0 auto}

/* Order screen */
.screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:20;transform:translateX(100%);transition:transform .22s ease}
.screen.open{transform:none}
.ohead{background:linear-gradient(135deg,#3b2418,#6f4e37);color:#fff;padding:calc(var(--st) + 8px) 8px 10px;display:flex;align-items:center;gap:6px}
.ohead h2{margin:0;font-size:19px;flex:1}
.ohead .ib{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px}
.ohead .ib:active{background:rgba(255,255,255,.15)}
.otools{padding:10px 12px 6px;display:flex;flex-direction:column;gap:9px;flex-shrink:0}
.mgrid{flex:1;overflow-y:auto;padding:4px 12px 150px;display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:9px;align-content:start}
.mcard{position:relative;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:10px 8px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;min-height:112px;transition:transform .08s}
.mcard .em{font-size:30px;line-height:1.2}
.mcard .em.im img{width:56px;height:56px;border-radius:12px;object-fit:cover;display:block}
.mrow .em.im img{width:32px;height:32px;border-radius:8px;object-fit:cover;display:block}
.ie-row{display:flex;gap:14px;align-items:center;margin-top:10px}
.ie-img{position:relative;width:96px;height:96px;flex-shrink:0;border-radius:14px;border:1.5px dashed var(--muted);background:var(--surface2);display:grid;place-items:center;cursor:pointer;overflow:hidden;text-align:center;font-size:12px;color:var(--muted)}
.ie-img img{width:100%;height:100%;object-fit:cover}
.ie-img b{display:block;font-size:32px;line-height:1.1}
.mcard .nm{font-size:13.5px;font-weight:600;line-height:1.25}
.mcard .pr{font-size:12.5px;color:var(--primary);font-weight:700;margin-top:auto}
.mcard .badge{position:absolute;top:6px;right:6px;background:var(--accent);color:#fff;font-size:12px;font-weight:700;min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;padding:0 6px}
.mcard.off{opacity:.4}
.mcard.off::after{content:"Hết";position:absolute;top:6px;left:6px;font-size:11px;background:var(--danger);color:#fff;padding:1px 6px;border-radius:8px}

.cart{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.15);
  padding:8px 14px calc(var(--sb) + 12px);display:flex;flex-direction:column;max-height:78%}
.grab{width:42px;height:5px;border-radius:3px;background:var(--border);margin:0 auto 8px}
.clines{overflow-y:auto;display:none;margin-bottom:8px}
.cart.expanded .clines{display:block}
.line{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--border)}
.line .lmain{flex:1;min-width:0}
.line .lname{font-weight:600;font-size:14.5px}
.line .lsub{font-size:12.5px;color:var(--muted)}
.line .lsub i{color:var(--accent);font-style:normal}
.line .lamt{width:74px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
.qty{display:flex;align-items:center;background:var(--surface2);border-radius:10px}
.qty button{width:34px;height:34px;font-size:19px;font-weight:700;color:var(--primary)}
.qty b{min-width:20px;text-align:center;font-variant-numeric:tabular-nums}
.ibtn{width:34px;height:34px;border-radius:10px;background:var(--surface2);font-size:15px}
.cbar{display:flex;align-items:center;gap:10px}
.cbar .tot{flex:1}
.cbar .tot b{font-size:21px;font-variant-numeric:tabular-nums;display:block;line-height:1.1}
.cbar .tot span{font-size:12.5px;color:var(--muted)}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(20,12,6,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92dvh;overflow-y:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(var(--sb) + 16px);animation:up .2s ease}
.sheet h3{margin:0 0 6px;font-size:18px}
@keyframes up{from{transform:translateY(40px);opacity:.6}}
@keyframes fade{from{opacity:0}}
.kv{display:flex;justify-content:space-between;padding:6px 0;font-variant-numeric:tabular-nums}
.kv.big{font-size:22px;font-weight:800;color:var(--primary);border-top:1px dashed var(--border);margin-top:4px;padding-top:10px}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px}
.seg button{flex:1;padding:9px 6px;border-radius:10px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.cashbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.cashbtns button{padding:10px 4px;border-radius:10px;background:var(--surface);border:1px solid var(--border);font-weight:600;font-size:14px}
.qrbox{background:#fff;color:#111;border-radius:16px;padding:12px;margin-top:10px;text-align:center}
.qrbox svg{display:block;width:230px;max-width:75vw;height:auto;margin:0 auto}
.qrbox .qa{font-size:22px;font-weight:800;color:#6f4e37;margin-top:4px}
.qrbox .qi{font-size:13px;color:#555;line-height:1.35}
.warn{background:#fff4e0;color:#7a4b00;border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:10px}
@media (prefers-color-scheme:dark){.warn{background:#3a2a12;color:#f3c98a}}
.tpick{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.tpick button{padding:12px 0;border-radius:12px;background:var(--surface);border:1px solid var(--border);font-weight:700}
.tpick button.busy{background:var(--busy1);color:#fff;border-color:var(--busy1)}
.notechips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}

/* Menu admin */
.mrow{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border)}
.mrow:last-child{border-bottom:0}
.mrow .em{font-size:24px;width:32px;text-align:center}
.mrow .nm{flex:1;font-weight:600}
.mrow .nm small{display:block;color:var(--primary);font-weight:700}
.sw{position:relative;width:46px;height:28px;border-radius:14px;background:var(--border);flex-shrink:0;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on{background:var(--ok)}
.sw.on::after{left:21px}

/* Report */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border-radius:14px;padding:12px 13px;box-shadow:var(--shadow)}
.kpi span{font-size:12px;color:var(--muted)}
.kpi b{display:block;font-size:19px;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi.main{grid-column:1/-1;background:linear-gradient(135deg,#3b2418,#6f4e37);color:#fff}
.kpi.main span{color:rgba(255,255,255,.8)}
.kpi.main b{font-size:28px}
.bars{display:flex;align-items:flex-end;gap:4px;height:130px;padding-top:6px}
.bars .bc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bars .b{width:100%;max-width:26px;background:linear-gradient(var(--accent),var(--primary2));border-radius:5px 5px 2px 2px;min-height:2px}
.bars .bl{font-size:10px;color:var(--muted);margin-top:4px;white-space:nowrap}
.top5{display:flex;align-items:center;gap:10px;padding:7px 0}
.top5 .tb{height:8px;border-radius:4px;background:var(--accent);margin-top:4px}
.bill{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--border);width:100%;text-align:left}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:7px;background:var(--surface2)}
.tag.ck{background:#d8ecff;color:#1e5c99}
.tag.tm{background:#dcf3e6;color:#1d7a4c}
@media (prefers-color-scheme:dark){.tag.ck{background:#1e3550;color:#9cc8f2}.tag.tm{background:#1d3a2b;color:#8fd9b2}}

.toast{position:fixed;left:50%;bottom:calc(var(--sb) + 90px);transform:translateX(-50%);background:#2a1d16;color:#fff;padding:10px 18px;border-radius:22px;font-size:14px;z-index:99;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:fade .2s}

/* Print */
#print{display:none}
@media print{
  @page{margin:0;size:80mm auto}
  body{display:block;height:auto;overflow:visible;background:#fff;color:#000}
  body>*:not(#print){display:none!important}
  #print{display:block;width:72mm;margin:0 auto;padding:4mm 0;font:12px/1.35 "Courier New",monospace;color:#000}
  #print .c{text-align:center}
  #print h2{font-size:16px;margin:0}
  #print table{width:100%;border-collapse:collapse}
  #print td{padding:2px 0;vertical-align:top}
  #print .r{text-align:right}
  #print hr{border:0;border-top:1px dashed #000;margin:6px 0}
  #print .t{font-size:15px;font-weight:bold}
  #print .pqr svg{width:42mm;height:42mm;display:block;margin:6px auto 2px}
  #print .pqr{text-align:center;font-size:11px}
}

/* Logo & đăng nhập */
.top .tl{display:flex;align-items:center;gap:11px;min-width:0}
.top .tl>div{min-width:0}
.logo-s{width:42px;height:42px;border-radius:11px;object-fit:cover;flex-shrink:0;background:#222544;border:1.5px solid rgba(255,255,255,.55);box-shadow:0 2px 8px rgba(0,0,0,.35)}
.top h1,.top .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr{display:flex;align-items:center;gap:8px;flex-shrink:0}
.who{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.15);padding:4px 5px 4px 11px;border-radius:20px;font-size:13px;max-width:150px}
@media(max-width:560px){.tr .clock{display:none}.who{max-width:112px}}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who button{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:15px;flex-shrink:0}
.auth{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:96px 18px 24px;overflow-y:auto;
  background:radial-gradient(1200px 600px at 20% -10%,#6f4e37 0,transparent 60%),linear-gradient(160deg,#2a1810,#3b2418 55%,#1b100a)}
.auth-card{width:100%;max-width:400px;background:var(--surface);border-radius:24px;padding:26px 22px 20px;box-shadow:0 24px 60px rgba(0,0,0,.45);margin:auto}
.auth-logo{display:block;width:150px;height:150px;border-radius:26px;object-fit:cover;margin:-72px auto 10px;background:#222544;border:4px solid var(--surface);box-shadow:0 10px 28px rgba(0,0,0,.4)}
.auth-card h2{margin:0 0 2px;font-size:22px;text-align:center}
.auth-card .sub2{text-align:center;color:var(--muted);font-size:13.5px;margin:0 0 14px}
.auth-card .pw{position:relative}
.auth-card .pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);padding:6px 9px;font-size:18px}
.auth-msg{min-height:20px;margin:10px 2px 0;font-size:13.5px;color:var(--danger);text-align:center}
.auth-card .btn.pri{width:100%;margin-top:14px;padding:14px;font-size:16px}
.auth-foot{text-align:center;font-size:11.5px;color:var(--muted);margin-top:14px}
.urow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.urow:last-child{border:0}
.urow .av{width:36px;height:36px;border-radius:50%;background:var(--primary);color:var(--ink);display:grid;place-items:center;font-weight:700;flex-shrink:0}
.urow .nm{flex:1;text-align:left;min-width:0}.urow .nm small{display:block;color:var(--muted)}
.tag2{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--surface2);color:var(--primary)}
.logo-ed{display:flex;gap:14px;align-items:center}.logo-ed img{width:84px;height:84px;border-radius:16px;object-fit:cover;background:#222544;flex-shrink:0}
</style>
</head>
<body>

<header class="top">
  <div class="toprow">
    <div class="tl"><img class="logo-s" id="logoS" alt="Logo" src="icons/logo.jpg">
      <div>
        <h1 id="shopName">Cà Phê POS</h1>
        <div class="sub" id="shopSub">Quản lý bàn & tính tiền</div>
      </div>
    </div>
    <div class="tr"><div class="clock" id="clock">--:--</div>
      <div class="who" id="who"><span id="whoName"></span><button data-act="logout" aria-label="Đăng xuất" title="Đăng xuất">⎋</button></div></div>
  </div>
</header>

<main id="main"></main>

<nav class="tabbar">
  <button data-act="tab" data-tab="tables" class="on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>Bàn</button>
  <button data-act="tab" data-tab="menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9h13v4a6 6 0 0 1-6 6H10a6 6 0 0 1-6-6z"/><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M8 2v3M12 2v3"/></svg>Thực đơn</button>
  <button data-act="tab" data-tab="report">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Báo cáo</button>
  <button data-act="tab" data-tab="settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Cài đặt</button>
</nav>

<!-- Màn hình gọi món -->
<section class="screen" id="order">

const bankLabel = bin => { const b = BANKS.find(x => x[0] === bin); return b ? b[2] : 'Mã ' + bin; };

/* Chuỗi VietQR theo chuẩn EMVCo / NAPAS: mọi app ngân hàng VN quét được, không cần mạng */
const tlv = (id, v) => id + String(v.length).padStart(2, '0') + v;
function crc16(str) {
  let c = 0xFFFF;
  for (const b of new TextEncoder().encode(str)) {
    c ^= b << 8;
    for (let i = 0; i < 8; i++) c = c & 0x8000 ? ((c << 1) ^ 0x1021) & 0xFFFF : (c << 1) & 0xFFFF;
  }
  return c.toString(16).toUpperCase().padStart(4, '0');
}
function vietQRPayload(bin, acc, amount, info) {
  const mai = tlv('00', 'A000000727') + tlv('01', tlv('00', bin) + tlv('01', acc)) + tlv('02', 'QRIBFTTA');
  const memo = norm(info || '').toUpperCase().replace(/[^A-Z0-9 ]/g, '').trim().slice(0, 25);
  const s = tlv('00', '01') + tlv('01', amount ? '12' : '11') + tlv('38', mai) + tlv('53', '704')
    + (amount ? tlv('54', String(Math.round(amount))) : '') + tlv('58', 'VN')
    + (memo ? tlv('62', tlv('08', memo)) : '') + '6304';
  return s + crc16(s);
}
const hasBank = () => !!(S.settings.bankId && S.settings.bankAcc);
function qrSvg(amount, info) {
  const q = qrcode(0, 'M');
  q.addData(vietQRPayload(S.settings.bankId, S.settings.bankAcc, amount, info));
  q.make();
  return q.createSvgTag({ cellSize: 4, margin: 4, scalable: true });
}
// Khối QR hiển thị trên màn hình
function qrBlock(amount, info) {
  const s = S.settings;
  return `<div class="qrbox">${qrSvg(amount, info)}
    <div class="qa">${fmt(amount)}</div>
    <div class="qi"><b>${esc(bankLabel(s.bankId))}</b> · ${esc(s.bankAcc)}<br>${esc(s.bankName)}<br>Nội dung: ${esc(norm(info).toUpperCase())}</div></div>`;
}

const QUICK_NOTES = ['Ít đường', 'Nhiều đường', 'Không đường', 'Ít đá', 'Không đá', 'Nóng', 'Mang về', 'Không hành', 'Thêm trứng'];

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

function defaultState() {
  return {
    settings: { shopName: 'Cà Phê POS', logo: '', address: '', phone: '', tableCount: 20, footer: 'Cảm ơn quý khách - Hẹn gặp lại!', bankId: '', bankAcc: '', bankName: '' },
    cats: DEFAULT_CATS.slice(),
    menu: DEFAULT_MENU.map(([name, cat, price, emoji]) => ({ id: uid() + Math.random().toString(36).slice(2, 4), name, cat, price, emoji, off: false })),
    tables: {},
    bills: [],
    users: [],
    seq: 0
  };
}
const emHTML = m => m.img ? `<span class="em im"><img src="${m.img}" alt="" loading="lazy"></span>` : `<span class="em">${esc(m.emoji || '🍽️')}</span>`;
// Đọc ảnh sản phẩm → cắt vuông giữa, thu nhỏ 240px, nền trắng, JPEG (~10–20 KB)
function readImage(file) {
  return new Promise((res, rej) => {
    if (!file || !/^image\//.test(file.type)) return rej(new Error('File không phải hình ảnh'));
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const z = Math.min(im.width, im.height), N = 240, c = document.createElement('canvas'); c.width = c.height = N;
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, N, N);
      g.drawImage(im, (im.width - z) / 2, (im.height - z) / 2, z, z, 0, 0, N, N); URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.82));
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Không đọc được ảnh')); };
    im.src = url;
  });
}
function load() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) { const s = JSON.parse(raw); const d = defaultState(); return { ...d, ...s, settings: { ...d.settings, ...s.settings } }; }
  } catch (e) { console.warn(e); }
  return defaultState();
}
let S = load();
{ const b = BANKS.find(x => x[1] === S.settings.bankId); if (b) S.settings.bankId = b[0]; }
function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); }
  catch (e) { toast('⚠️ Không lưu được dữ liệu (bộ nhớ đầy?)'); }
}

/* ================= TIỆN ÍCH ================= */
const $ = s => document.querySelector(s);
const fmt = n => (Math.round(n) || 0).toLocaleString('vi-VN') + 'đ';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();
const subtotal = items => items.reduce((a, l) => a + l.price * l.qty, 0);
const countQty = items => items.reduce((a, l) => a + l.qty, 0);
const tableName = k => k === 'mv' ? 'Mang về' : 'Bàn ' + k;
const pad = n => String(n).padStart(2, '0');
const hhmm = t => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const ddmm = t => { const d = new Date(t); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear(); };
const isoDate = t => { const d = new Date(t); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
function elapsed(t) {
  const m = Math.max(0, Math.floor((Date.now() - t) / 60000));
  return m < 60 ? m + ' phút' : Math.floor(m / 60) + 'g' + pad(m % 60) + 'p';
}
function toast(msg) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), 1800);
}
const buzz = () => { try { navigator.vibrate && navigator.vibrate(12); } catch (e) {} };

/* ================= LOGO ================= */
const logoSrc = () => S.settings.logo || 'icons/logo.jpg';
// Ảnh logo/ảnh tải lên: cắt vuông giữa, thu nhỏ 256px, JPEG
function readImage(file) {
  return new Promise((res, rej) => {
    if (!file || !/^image\//.test(file.type)) return rej(new Error('File không phải hình ảnh'));
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const z = Math.min(im.width, im.height), N = 256, c = document.createElement('canvas'); c.width = c.height = N;
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, N, N);
      g.drawImage(im, (im.width - z) / 2, (im.height - z) / 2, z, z, 0, 0, N, N); URL.revokeObjectURL(url);

    };

    im.src = url;

}

/* ================= TÀI KHOẢN & ĐĂNG NHẬP ================= */
// Mật khẩu băm PBKDF2-SHA256 (120.000 vòng) + muối riêng từng tài khoản, không lưu mật khẩu gốc.
// Quản lý: toàn quyền. Thu ngân: chỉ xem sơ đồ bàn, gọi món, thanh toán.
const ROLES = { admin: 'Quản lý', staff: 'Thu ngân' };
const SESS_KEY = 'cafe-pos-session', LASTUSER_KEY = 'cafe-pos-lastuser';
let ME = null;
const isAdmin = () => !!ME && ME.role === 'admin';
const can = tab => tab === 'tables' || isAdmin();
const hex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
async function hashPw(pw, salt) {
  if (!(window.crypto && crypto.subtle)) throw new Error('Trình duyệt cần mở bằng https:// để đăng nhập');
  const enc = new TextEncoder(), key = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
  return hex(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: enc.encode(salt), iterations: 120000, hash: 'SHA-256' }, key, 256));
}
const newSalt = () => hex(crypto.getRandomValues(new Uint8Array(12)));
const sessGet = () => { try { return sessionStorage.getItem(SESS_KEY); } catch (e) { return null; } };
const sessSet = v => { try { v ? sessionStorage.setItem(SESS_KEY, v) : sessionStorage.removeItem(SESS_KEY); } catch (e) {} };
const lastUser = () => { try { return localStorage.getItem(LASTUSER_KEY) || ''; } catch (e) { return ''; } };
function authShell(inner) {
  const a = $('#auth'); a.classList.remove('hidden');
  a.innerHTML = `<div class="auth-card"><img class="auth-logo" src="${logoSrc()}" alt="Logo">${inner}
    <div class="auth-foot">Cà Phê POS · © Bản quyền thuộc về Trần Hữu Nhật · 0913.193.668</div></div>`;
}
const pwField = (id, label) => `<label class="f">${label}</label><div class="pw"><input id="${id}" type="password" autocomplete="off"><button type="button" data-pw="${id}" aria-label="Hiện mật khẩu">👁</button></div>`;
function bindPwToggle(root) { root.querySelectorAll('[data-pw]').forEach(b => b.onclick = () => { const i = $('#' + b.dataset.pw); i.type = i.type === 'password' ? 'text' : 'password'; }); }
function gate() {
  ME = null;
  if (!S.users.length) return authSetup();
  const u = S.users.find(x => x.id === sessGet());
  if (u && u.active !== false) { ME = u; $('#auth').classList.add('hidden'); $('#auth').innerHTML = ''; render(); return; }
  sessSet(null); authLogin();
}
function authSetup() {
  authShell(`<h2>Thiết lập lần đầu</h2><p class="sub2">Tạo tài khoản <b>Quản lý</b> để bảo vệ dữ liệu quán. Dữ liệu hiện có được giữ nguyên.</p>
    <label class="f">Tên quán</label><input id="suShop" value="${esc(S.settings.shopName === 'Cà Phê POS' ? 'Coffee Sông Hậu 1' : S.settings.shopName)}">
    <label class="f">Họ tên quản lý</label><input id="suName" placeholder="VD: Nguyễn Văn A">
    <label class="f">Tên đăng nhập</label><input id="suUser" autocomplete="off" autocapitalize="none" placeholder="VD: admin">
    ${pwField('suPw', 'Mật khẩu (ít nhất 6 ký tự)')}${pwField('suPw2', 'Nhập lại mật khẩu')}
    <div class="auth-msg" id="authMsg"></div><button class="btn pri" id="suOk">Tạo tài khoản & bắt đầu</button>`);
  bindPwToggle($('#auth'));
  const msg = t => $('#authMsg').textContent = t;
  $('#suOk').onclick = async () => {
    const shop = $('#suShop').value.trim(), name = $('#suName').value.trim(), un = $('#suUser').value.trim().toLowerCase(), pw = $('#suPw').value;
    if (!name) return msg('Nhập họ tên quản lý'); if (!/^[a-z0-9._-]{3,}$/.test(un)) return msg('Tên đăng nhập ≥ 3 ký tự, chỉ gồm chữ không dấu, số, . _ -');
    if (pw.length < 6) return msg('Mật khẩu ít nhất 6 ký tự'); if (pw !== $('#suPw2').value) return msg('Hai mật khẩu chưa khớp');
    $('#suOk').disabled = true; msg('');
    try {
      const salt = newSalt(), u = { id: uid(), name, username: un, role: 'admin', active: true, salt, hash: await hashPw(pw, salt), created: Date.now() };
      S.users.push(u); if (shop) S.settings.shopName = shop; save(); sessSet(u.id); try { localStorage.setItem(LASTUSER_KEY, un); } catch (e) {}
      gate(); toast('Xin chào, ' + name + '!');
    } catch (e) { msg(e.message); $('#suOk').disabled = false; }
  };
  setTimeout(() => $('#suName').focus(), 100);
}
let failN = 0, lockUntil = 0;
function authLogin() {
  authShell(`<h2>${esc(S.settings.shopName || 'Cà Phê POS')}</h2><p class="sub2">Đăng nhập để sử dụng</p>
    <label class="f">Tên đăng nhập</label><input id="liUser" autocomplete="username" autocapitalize="none" value="${esc(lastUser())}">
    ${pwField('liPw', 'Mật khẩu')}
    <div class="auth-msg" id="authMsg"></div><button class="btn pri" id="liOk">Đăng nhập</button>`);
  bindPwToggle($('#auth'));
  const go = async () => {
    const msg = t => $('#authMsg').textContent = t, un = $('#liUser').value.trim().toLowerCase(), pw = $('#liPw').value;
    if (Date.now() < lockUntil) return msg(`Sai quá nhiều lần, thử lại sau ${Math.ceil((lockUntil - Date.now()) / 1000)} giây`);
    if (!un || !pw) return msg('Nhập tên đăng nhập và mật khẩu');
    $('#liOk').disabled = true;
    try {
      const u = S.users.find(x => x.username === un), ok = u && u.active !== false && (await hashPw(pw, u.salt)) === u.hash;
      if (!ok) { if (++failN >= 5) { lockUntil = Date.now() + 30000; failN = 0; } msg(u && u.active === false ? 'Tài khoản đã bị khóa' : 'Sai tên đăng nhập hoặc mật khẩu'); $('#liPw').value = ''; $('#liOk').disabled = false; return; }
      failN = 0; sessSet(u.id); try { localStorage.setItem(LASTUSER_KEY, un); } catch (e) {}
      ui.tab = 'tables'; gate(); toast('Xin chào, ' + u.name + '!');
    } catch (e) { msg(e.message); $('#liOk').disabled = false; }
  };
  $('#liOk').onclick = go; $('#liPw').onkeydown = $('#liUser').onkeydown = e => { if (e.key === 'Enter') go(); };
  setTimeout(() => ($('#liUser').value ? $('#liPw') : $('#liUser')).focus(), 100);
}
function logout() { sessSet(null); ME = null; closeModal(); if (ui.table) closeOrder(); ui.tab = 'tables'; authLogin(); }

/* ---- Quản lý tài khoản (Cài đặt) ---- */
function usersCard() {
  return `<div class="sec-title">Tài khoản đăng nhập</div><div class="card">
    ${S.users.map(u => `<div class="urow"><span class="av">${esc((u.name.trim()[0] || '?').toUpperCase())}</span>
      <span class="nm"><b>${esc(u.name)}</b>${u.id === ME.id ? ' <span class="tag2">Bạn</span>' : ''}<small>${esc(u.username)} · ${ROLES[u.role]}${u.active === false ? ' · ĐÃ KHÓA' : ''}</small></span>
      <button class="btn" style="padding:8px 12px" data-act="editUser" data-id="${u.id}">Sửa</button></div>`).join('')}
    <div class="row" style="margin-top:12px"><button class="btn pri grow" data-act="editUser">＋ Thêm tài khoản</button><button class="btn grow" data-act="chpw">🔑 Đổi mật khẩu của tôi</button></div></div>`;
}
function editUser(id) {
  const o = id ? S.users.find(x => x.id === id) : null;
  openModal(`<h3>${o ? 'Sửa tài khoản' : 'Thêm tài khoản'}</h3>
    <label class="f">Họ tên</label><input id="uName" value="${esc(o ? o.name : '')}">
    <label class="f">Tên đăng nhập</label><input id="uUser" autocapitalize="none" value="${esc(o ? o.username : '')}" ${o ? 'disabled' : ''} placeholder="VD: thungan1">
    <label class="f">Vai trò</label><select id="uRole" ${o && o.id === ME.id ? 'disabled' : ''}>${Object.entries(ROLES).map(([k, v]) => `<option value="${k}" ${o && o.role === k ? 'selected' : ''}>${v}${k === 'staff' ? ' (bán hàng)' : ' (toàn quyền)'}</option>`).join('')}</select>
    ${pwField('uPw', o ? 'Mật khẩu mới (để trống = giữ nguyên)' : 'Mật khẩu (ít nhất 6 ký tự)')}
    ${o && o.id !== ME.id ? `<label class="f" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="uActive" style="width:auto" ${o.active !== false ? 'checked' : ''}> Cho phép đăng nhập</label>` : ''}
    <div class="auth-msg" id="uMsg" style="text-align:left"></div>
    <div class="row" style="margin-top:10px">${o && o.id !== ME.id ? `<button class="btn danger" data-act="delUser" data-id="${o.id}">Xóa</button>` : ''}<button class="btn ghost grow" data-act="closeModal">Hủy</button><button class="btn pri grow" id="uOk">Lưu</button></div>`);
  bindPwToggle($('#sheet'));
  $('#uOk').onclick = async () => {
    const msg = t => $('#uMsg').textContent = t, name = $('#uName').value.trim(), pw = $('#uPw').value;
    const un = o ? o.username : $('#uUser').value.trim().toLowerCase();
    if (!name) return msg('Nhập họ tên'); if (!o && !/^[a-z0-9._-]{3,}$/.test(un)) return msg('Tên đăng nhập ≥ 3 ký tự, chỉ gồm chữ không dấu, số, . _ -');
    if (!o && S.users.some(x => x.username === un)) return msg('Tên đăng nhập đã tồn tại');
    if ((!o || pw) && pw.length < 6) return msg('Mật khẩu ít nhất 6 ký tự');
    try {
      const u = o || { id: uid(), username: un, created: Date.now(), active: true };
      u.name = name; if (!o || o.id !== ME.id) u.role = $('#uRole').value;
      if ($('#uActive')) u.active = $('#uActive').checked;
      if (pw) { u.salt = newSalt(); u.hash = await hashPw(pw, u.salt); }
      if (!o) S.users.push(u);
      if (!S.users.some(x => x.role === 'admin' && x.active !== false)) return msg('Phải còn ít nhất 1 Quản lý đang hoạt động');

/* ================= SƠ ĐỒ BÀN ================= */
function tableCard(k) {
  const t = S.tables[k]; const has = t && t.items.length;
  const wide = k === 'mv';
  const num = wide ? '🛍️' : pad(k);
  return `<button class="tcard ${has ? 'busy' : ''} ${wide ? 'wide' : ''}" data-act="openTable" data-t="${k}">
    <span class="tnum">${num}</span>
    <span class="tlabel">${tableName(k)}${has ? ' · ' + countQty(t.items) + ' món' : ''}</span>
    ${has ? `<span class="tamt">${fmt(subtotal(t.items))}</span><span class="ttime">⏱ ${elapsed(t.openedAt)}</span>`
          : `<span class="tfree">● Trống</span>`}
  </button>`;
}
function renderTables() {
  const n = S.settings.tableCount;
  let busy = 0, sum = 0, cards = '';
  const keys = ['mv']; for (let i = 1; i <= n; i++) keys.push(String(i));
  keys.forEach(k => {
    const t = S.tables[k]; const has = t && t.items.length;
    if (has) { if (k !== 'mv') busy++; sum += subtotal(t.items); }
    if (ui.filter === 'busy' && !has) return;
    if (ui.filter === 'free' && has) return;
    cards += tableCard(k);
  });
  const [a, b] = dayRange(0); const todayRev = S.bills.filter(x => x.time >= a && x.time < b).reduce((s, x) => s + x.total, 0);
  $('#main').innerHTML = `
    <div class="summary">
      <div class="stat"><b>${busy}/${n}</b><span>Bàn đang có khách</span></div>
      <div class="stat"><b>${fmt(sum)}</b><span>Đang phục vụ (tạm tính)</span></div>
      <div class="stat" style="grid-column:1/-1"><b>${fmt(todayRev)}</b><span>Doanh thu đã thu hôm nay</span></div>
    </div>
    <div class="chips">
      ${[['all', 'Tất cả'], ['busy', 'Có khách'], ['free', 'Bàn trống']].map(([v, l]) => `<button class="chip ${ui.filter === v ? 'on' : ''}" data-act="filter" data-v="${v}">${l}</button>`).join('')}

    <div class="tgrid">${cards || '<p class="muted">Không có bàn nào.</p>'}</div>`;
}

  const keys = ['mv']; for (let i = 1; i <= S.settings.tableCount; i++) keys.push(String(i));

function moveTo(to) {
  const from = ui.table; const src = S.tables[from]; if (!src) return;
  const dst = S.tables[to];
  if (dst && dst.items.length) {
    if (!confirm(`${tableName(to)} đang có khách. Gộp đơn ${tableName(from)} vào ${tableName(to)}?`)) return;
    src.items.forEach(l => {
      const same = dst.items.find(x => x.itemId === l.itemId && x.note === l.note && x.price === l.price);
      if (same) same.qty += l.qty; else dst.items.push(l);
    });
    dst.openedAt = Math.min(dst.openedAt, src.openedAt);
  } else S.tables[to] = src;
  delete S.tables[from];
  save(); closeModal(); toast(`Đã chuyển sang ${tableName(to)}`);
  ui.table = to; renderOrder();
}
function clearTable() {
  if (!confirm(`Hủy toàn bộ món của ${tableName(ui.table)}?`)) return;

        : `<div class="warn">Chưa có tài khoản ngân hàng nên chưa tạo được mã QR.

      <button class="btn ok grow" data-act="confirmPay">✓ Đã thu</button>
    </div>`);
  $('#discIn').addEventListener('input', e => { pay.disc = Math.max(0, +e.target.value || 0); updatePay(); });
  $('#givenIn').addEventListener('input', e => { pay.given = Math.max(0, +e.target.value || 0); updatePay(false); });
  updatePay();
}
function payCalc() {
  const sub = subtotal(curItems());
  const d = pay.discType === '%' ? Math.round(sub * Math.min(pay.disc, 100) / 100) : Math.min(pay.disc, sub);
  const total = sub - d;
  return { sub, d, total, change: Math.max(0, pay.given - total) };
}
function updatePay(rebuildBtns = true) {
  const c = payCalc();
  $('#pSub').textContent = fmt(c.sub);
  $('#pDisc').textContent = c.d ? '−' + fmt(c.d) : '0đ';
  $('#pTotal').textContent = fmt(c.total);
  $('#pChange').textContent = pay.given >= c.total ? fmt(c.change) : (pay.given ? 'Thiếu ' + fmt(c.total - pay.given) : '0đ');
  $('#pChange').style.color = pay.given && pay.given < c.total ? 'var(--danger)' : 'var(--ok)';
  $('#cashBox').classList.toggle('hidden', pay.method !== 'cash');
  $('#bankBox').classList.toggle('hidden', pay.method !== 'bank');
  if (rebuildBtns) {
    const sug = new Set([c.total]);
    [10000, 50000, 100000, 200000, 500000].forEach(s => { const v = Math.ceil(c.total / s) * s; if (v > c.total) sug.add(v); });
    $('#cashBtns').innerHTML = [...sug].sort((a, b) => a - b).slice(0, 6).map((v, i) => `<button data-act="given" data-v="${v}">${i === 0 ? 'Đủ ' : ''}${(v / 1000).toLocaleString('vi-VN')}k</button>`).join('');
  }
  const qr = $('#qrHere');
  if (qr && pay.method === 'bank') qr.innerHTML = qrBlock(c.total, tableName(ui.table));
}
function printPayQR() {
  const c = payCalc(); const items = curItems();
  printBill({ tableName: tableName(ui.table), items, sub: c.sub, disc: c.d, total: c.total, time: Date.now() }, true);
}
function confirmPay(doPrint) {
  const c = payCalc();
  if (pay.method === 'cash' && pay.given && pay.given < c.total) return toast('Khách đưa chưa đủ tiền');
  const k = ui.table; const t = S.tables[k];
  const bill = {
    id: ++S.seq, table: k, tableName: tableName(k), items: t.items.map(l => ({ ...l })),
    sub: c.sub, disc: c.d, total: c.total, method: pay.method,
    given: pay.method === 'cash' ? (pay.given || c.total) : c.total, change: pay.method === 'cash' ? c.change : 0,
    openedAt: t.openedAt, time: Date.now()
  };
  S.bills.push(bill);
  delete S.tables[k];
  save(); closeModal();
  toast(`✓ Đã thu ${fmt(bill.total)} · ${bill.tableName}`);
  if (doPrint) printBill(bill);
  closeOrder();
}

/* ================= BÁO CÁO ================= */
function dayRange(offsetDays) {
  const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + offsetDays);
  const e = new Date(d); e.setDate(e.getDate() + 1); return [+d, +e];
}
function reportRange() {
  const today = dayRange(0);
  switch (ui.rpt) {
    case 'today': return today;
    case 'yest': return dayRange(-1);
    case '7d': return [dayRange(-6)[0], today[1]];
    case 'month': { const d = new Date(); return [+new Date(d.getFullYear(), d.getMonth(), 1), today[1]]; }
    default: {
      const a = new Date(ui.from + 'T00:00:00'), b = new Date(ui.to + 'T00:00:00'); b.setDate(b.getDate() + 1);
      return [+a, +b];
    }
  }
}
function renderReport() {
  const [a, b] = reportRange();
  const bills = S.bills.filter(x => x.time >= a && x.time < b);
  const rev = bills.reduce((s, x) => s + x.total, 0);
  const cash = bills.filter(x => x.method === 'cash').reduce((s, x) => s + x.total, 0);
  const disc = bills.reduce((s, x) => s + x.disc, 0);
  // Biểu đồ
  const oneDay = b - a <= 864e5;
  let bars = [];
  if (oneDay) {
    const hs = bills.map(x => new Date(x.time).getHours());
    const h0 = Math.min(6, ...hs), h1 = Math.max(21, ...hs);
    for (let h = h0; h <= h1; h++) bars.push({ l: h + 'h', v: bills.filter(x => new Date(x.time).getHours() === h).reduce((s, x) => s + x.total, 0) });
  } else {
    for (let t = a; t < b; t += 864e5) {
      const d = new Date(t);
      bars.push({ l: d.getDate() + '/' + (d.getMonth() + 1), v: bills.filter(x => x.time >= t && x.time < t + 864e5).reduce((s, x) => s + x.total, 0) });
    }
    if (bars.length > 31) bars = bars.slice(-31);
  }
  const maxV = Math.max(1, ...bars.map(x => x.v));
  // Top món
  const agg = {};
  bills.forEach(x => x.items.forEach(l => { const o = agg[l.name] || (agg[l.name] = { q: 0, v: 0 }); o.q += l.qty; o.v += l.qty * l.price; }));
  const top = Object.entries(agg).sort((p, q) => q[1].q - p[1].q).slice(0, 8);
  const maxQ = Math.max(1, ...top.map(x => x[1].q));

  $('#main').innerHTML = `
    <div class="chips">${[['today', 'Hôm nay'], ['yest', 'Hôm qua'], ['7d', '7 ngày'], ['month', 'Tháng này'], ['custom', 'Tùy chọn']]
      .map(([v, l]) => `<button class="chip ${ui.rpt === v ? 'on' : ''}" data-act="rpt" data-v="${v}">${l}</button>`).join('')}</div>
    ${ui.rpt === 'custom' ? `<div class="row" style="margin-top:10px"><input type="date" id="rFrom" value="${ui.from}"><span>→</span><input type="date" id="rTo" value="${ui.to}"></div>` : ''}
    <div class="kpis" style="margin-top:12px">
      <div class="kpi main"><span>Doanh thu</span><b>${fmt(rev)}</b></div>
      <div class="kpi"><span>Số hóa đơn</span><b>${bills.length}</b></div>
      <div class="kpi"><span>TB / hóa đơn</span><b>${fmt(bills.length ? rev / bills.length : 0)}</b></div>
      <div class="kpi"><span>💵 Tiền mặt</span><b>${fmt(cash)}</b></div>
      <div class="kpi"><span>🏦 Chuyển khoản</span><b>${fmt(rev - cash)}</b></div>
      ${disc ? `<div class="kpi" style="grid-column:1/-1"><span>Đã giảm giá</span><b>${fmt(disc)}</b></div>` : ''}
    </div>
    <div class="sec-title">Doanh thu theo ${oneDay ? 'giờ' : 'ngày'}</div>
    <div class="card"><div class="bars">${bars.map(x => `<div class="bc" title="${x.l}: ${fmt(x.v)}"><div class="b" style="height:${x.v / maxV * 100}%"></div><span class="bl">${x.l}</span></div>`).join('')}</div></div>
    <div class="sec-title">Món bán chạy</div>
    <div class="card">${top.map(([n, o], i) => `<div class="top5"><b style="width:20px;color:var(--muted)">${i + 1}</b>
      <div class="grow"><div class="row"><span class="grow">${esc(n)}</span><b>${o.q}</b><span class="muted" style="width:86px;text-align:right">${fmt(o.v)}</span></div>
      <div class="tb" style="width:${o.q / maxQ * 100}%"></div></div></div>`).join('') || '<p class="muted" style="margin:0">Chưa có dữ liệu.</p>'}</div>
    <div class="sec-title row"><span class="grow">Hóa đơn (${bills.length})</span><button class="tag" data-act="exportCsv">⬇ Xuất Excel (CSV)</button></div>
    <div class="card" style="padding:2px 12px">${bills.slice().reverse().map(x => `
      <button class="bill" data-act="billDetail" data-id="${x.id}">
        <b style="width:44px">#${pad(x.id)}</b>
        <span class="grow">${esc(x.tableName)}<br><small class="muted">${oneDay ? '' : ddmm(x.time) + ' '}${hhmm(x.time)} · ${countQty(x.items)} món</small></span>
        <span class="tag ${x.method === 'bank' ? 'ck' : 'tm'}">${x.method === 'bank' ? 'CK' : 'TM'}</span>
        <b style="min-width:84px;text-align:right">${fmt(x.total)}</b>
      </button>`).join('') || '<p class="muted">Chưa có hóa đơn trong khoảng này.</p>'}</div>`;
  if (ui.rpt === 'custom') {
    $('#rFrom').addEventListener('change', e => { ui.from = e.target.value || ui.from; renderReport(); });
    $('#rTo').addEventListener('change', e => { ui.to = e.target.value || ui.to; renderReport(); });
  }
}

async function shareOrDownload(name, text, type) {
  const blob = new Blob([text], { type });
  try {
    const file = new File([blob], name, { type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function exportCsv() {
  const [a, b] = reportRange();
  const bills = S.bills.filter(x => x.time >= a && x.time < b);
  const q = v => '"' + String(v).replace(/"/g, '""') + '"';
  const rows = [['Số HĐ', 'Ngày', 'Giờ', 'Bàn', 'Món', 'SL', 'Đơn giá', 'Thành tiền', 'Ghi chú', 'Giảm giá HĐ', 'Tổng HĐ', 'Hình thức']];
  bills.forEach(x => x.items.forEach((l, i) => rows.push([x.id, ddmm(x.time), hhmm(x.time), x.tableName, l.name, l.qty, l.price, l.qty * l.price, l.note || '',
    i === 0 ? x.disc : '', i === 0 ? x.total : '', x.method === 'bank' ? 'Chuyển khoản' : 'Tiền mặt'])));
  shareOrDownload(`doanh-thu_${isoDate(a)}_${isoDate(b - 1)}.csv`, '﻿' + rows.map(r => r.map(q).join(',')).join('\r\n'), 'text/csv');
}

function saveSettings() {
  const v = id => $('#' + id).value.trim();
  const n = Math.round(+v('sTables'));
  if (!(n >= 1 && n <= 200)) return toast('Số bàn từ 1 đến 200');
  if (v('sAcc') && !/^[0-9A-Za-z]{4,19}$/.test(v('sAcc').replace(/\s/g, ''))) return toast('Số tài khoản không hợp lệ');
  if (v('sAcc') && !v('sBank')) return toast('Chọn ngân hàng');
  const busyOver = Object.keys(S.tables).filter(k => k !== 'mv' && +k > n && S.tables[k].items.length);
  if (busyOver.length) return toast('Bàn ' + busyOver.join(', ') + ' đang có khách, chưa giảm được');
  Object.assign(S.settings, { shopName: v('sName') || 'Cà Phê POS', address: v('sAddr'), phone: v('sPhone'), tableCount: n, footer: v('sFooter'),
    bankId: v('sBank'), bankAcc: v('sAcc').replace(/\s/g, ''), bankName: norm(v('sAccName')).toUpperCase() });
  save(); render(); toast('Đã lưu cài đặt');
}
function restore(e) {
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d.menu || !d.settings || !Array.isArray(d.bills)) throw new Error('sai định dạng');
      if (!confirm(`Khôi phục dữ liệu (${d.bills.length} hóa đơn, ${d.menu.length} món)? Dữ liệu hiện tại sẽ bị thay thế.`)) return;
      const keep = Array.isArray(d.users) && d.users.length ? d.users : S.users;
      S = { ...defaultState(), ...d, users: keep, settings: { ...defaultState().settings, ...d.settings } };
      ME = S.users.find(x => x.id === (ME && ME.id)) || null; if (!ME) { sessSet(null); save(); return gate(); }
      save(); render(); toast('Đã khôi phục');
    } catch (err) { toast('File không hợp lệ'); }
  };
  r.readAsText(file);
}

};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = A[el.dataset.act]; if (fn) fn(el.dataset, el, e);
});
$('#oSearch').addEventListener('input', e => { ui.q = e.target.value; renderGrid(); });

/* Đồng hồ + cập nhật thời gian ngồi */
function tick() {
  const d = new Date();
  $('#clock').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ' · ' + pad(d.getDate()) + '/' + pad(d.getMonth() + 1);
}
setInterval(() => { tick(); if (ME && ui.tab === 'tables' && !ui.table && $('#modal').classList.contains('hidden')) renderTables(); }, 30000);
tick(); gate();

/* Chạy offline */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
